function translit(s){
  return (s||'').replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue')
    .replace(/Ä/g,'Ae').replace(/Ö/g,'Oe').replace(/Ü/g,'Ue').replace(/ß/g,'ss')
    .replace(/[^a-zA-Z0-9-]/g,'');
}
function downloadPdfBase64(b64,filename){
  const binary=atob(b64); const bytes=new Uint8Array(binary.length);
  for(let i=0;i<binary.length;i++) bytes[i]=binary.charCodeAt(i);
  const blob=new Blob([bytes],{type:'application/pdf'});
  const url=URL.createObjectURL(blob);
  const link=document.createElement('a'); link.href=url; link.download=filename;
  document.body.appendChild(link); link.click(); document.body.removeChild(link);
  setTimeout(()=>URL.revokeObjectURL(url),1200);
}
window.downloadOverviewPDF=()=>{
  try{
    const b64=generateOverviewPdf();
    const clean=(s)=>(s||'').trim().replace(/\s+/g,'-').replace(/[\/\\:*?"<>|]+/g,'');
    const vn=clean(state.firstName)||'Vorname';
    const nn=clean(state.lastName)||'Nachname';
    const filename=`Escape-Room-Überblick_von_${vn}_${nn}.pdf`;
    const binary=atob(b64); const bytes=new Uint8Array(binary.length);
    for(let i=0;i<binary.length;i++) bytes[i]=binary.charCodeAt(i);
    // Als application/octet-stream übergeben: Browser SPEICHERN die Datei, statt sie anzuzeigen
    // (Firefox-Standard „PDF im Browser öffnen" würde ein application/pdf nur anzeigen).
    // Die Datei selbst bleibt eine normale PDF; der Name mit .pdf kommt über das download-Attribut.
    const blob=new Blob([bytes],{type:'application/octet-stream'});
    const url=URL.createObjectURL(blob);
    // Unsichtbaren Link mit download-Attribut SYNCHRON im Klick-Handler klicken – kein window.open, kein neuer Tab
    const link=document.createElement('a');
    link.href=url; link.download=filename; link.style.display='none';
    document.body.appendChild(link);
    link.click();
    // Link und Object-URL erst nach ein paar Sekunden entfernen, damit der Download sicher gestartet ist
    setTimeout(()=>{ try{ document.body.removeChild(link); }catch(e){} URL.revokeObjectURL(url); },5000);
  }catch(e){ console.error(e); alert('Konnte die Datei „Escape-Room-Überblick" nicht erzeugen: '+e.message); }
};
window.downloadReflexionPDF=()=>{
  try{
    const b64=generateReflexionPdf();
    const name=translit(state.lastName)||'Schueler';
    downloadPdfBase64(b64,`Reflexion_${name}_${state.code}.pdf`);
  }catch(e){ console.error(e); alert('Konnte die Datei nicht erzeugen: '+e.message); }
};
window.openFeiditor=()=>{
  try{
    const tplEl=document.getElementById('feiditor-src');
    if(!tplEl){ alert('Der Feiditor konnte nicht geladen werden.'); return; }
    // Eingebetteten Feiditor-Quelltext holen und die escapten Script-End-Tags wiederherstellen
    let html=tplEl.textContent.replace(/<\\\/script>/gi,'<\/script>');
    // Escape-Room-Daten in den Feiditor injizieren: Name, die sechs Aufgaben, die roten Felder
    // und alle Daten für die Übersichts-Seiten der kombinierten PDF
    const data={
      firstName: state.firstName,
      lastName:  state.lastName,
      birthDate: state.birthDate,
      code:      state.code,
      tasks:     REFLECT_TASKS.slice(0,6),
      redFields: RED_FIELDS,
      overview:  {
        firstName:     state.firstName,
        lastName:      state.lastName,
        birthDate:     state.birthDate,
        code:          state.code,
        completedAt:   fmtDateTime(state.completedAt||new Date()),
        attempts:      state.attempts,
        mistakes:      state.mistakes,
        roomLabels:    ROOM_LABELS,
        solutionNotes: SOLUTION_NOTES,
        subtitle:      'Politik & Wirtschaft · Soziale Marktwirtschaft · Escape-Room „Stunde Null"'
      }
    };
    const inject='<script>window.__ESCAPE_DATA__='+JSON.stringify(data).replace(/</g,'\\u003c')+';<\/script>';
    // Direkt nach dem öffnenden <head> einfügen (erstes Vorkommen = echter Dokument-Head;
    // ein </head> käme auch in JS-Strings des Feiditors vor und wäre kein sicherer Anker)
    if(html.indexOf('<head>')!==-1) html=html.replace('<head>', '<head>\n'+inject);
    else html=inject+html;
    // Per document.write öffnen, damit der sichere Kontext (crypto.subtle) erhalten bleibt.
    // Ein Blob-URL würde den secure context verlieren -> Verschlüsselung schlägt fehl.
    const win=window.open('','_blank');
    if(!win){ alert('Bitte erlaube Pop-ups für diese Seite, damit sich das digitale Arbeitsblatt öffnen kann.'); return; }
    win.document.open();
    win.document.write(html);
    win.document.close();
  }catch(e){ console.error(e); alert('Das digitale Arbeitsblatt konnte nicht geöffnet werden: '+e.message); }
};
window.copyCode=async()=>{

    const d=document.getElementById('copyDesc'); if(d) d.innerHTML='Code in die Zwischenablage kopiert. Trage ihn in die Moodle-Aufgabe ein.';
  }catch(e){ const d=document.getElementById('copyDesc'); if(d) d.innerHTML='Code: <strong class="font-mono">'+state.code+'</strong> – bitte manuell kopieren.'; }

const root=document.getElementById('screenContainer');
const sealsBox=document.getElementById('progressSeals');

function renderSeals(){
  sealsBox.innerHTML='';
  for(let i=0;i<6;i++){
    const lib=document.createElement('div'); lib.className='seal library';
    const sc=state.screen;
    const isLibActive = (sc==='lib'+(i+1)) || (sc==='lib2alt' && i===1);
    if(isLibActive) lib.classList.add('active');
    else if(state.solved[i] || sc==='room'+(i+1)
      || (sc.startsWith('room') && parseInt(sc.slice(4))>i+1)
      || (sc.startsWith('lib') && parseInt((sc.match(/\d+/)||[0])[0])>i+1)
      || sc==='final') lib.classList.add('visited');
    sealsBox.appendChild(lib);

    const s=document.createElement('div'); s.className='seal';
    if(state.solved[i]){ s.classList.add('solved'); s.textContent=CODE_WORD[i]; }
    else if(state.screen==='room'+(i+1)){ s.classList.add('active'); s.textContent=i+1; }
    else s.textContent=i+1;
    sealsBox.appendChild(s);
  }
}

window.maskBirth=(el)=>{
  let v=el.value.replace(/[^0-9]/g,'').slice(0,8);
  let out=v;
  if(v.length>4) out=v.slice(0,2)+'.'+v.slice(2,4)+'.'+v.slice(4);
  else if(v.length>2) out=v.slice(0,2)+'.'+v.slice(2);
  el.value=out;
};
window.submitStart=()=>{
  const fn=document.getElementById('firstNameInput').value.trim();
  const ln=document.getElementById('lastNameInput').value.trim();
  const bd=document.getElementById('birthInput').value.trim();
  const err=document.getElementById('startError');
  function showErr(msg){ err.style.display='block'; err.textContent=msg; }
  if(fn.length<2||ln.length<2){ showErr('Bitte trage deinen vollen Vor- und Nachnamen ein (jeweils mindestens 2 Zeichen).'); return; }
  const m=bd.match(/^(\d{2})\.(\d{2})\.(\d{4})$/);
  if(!m){ showErr('Bitte gib dein Geburtsdatum im Format TT.MM.JJJJ ein (z. B. 07.03.2006).'); return; }
  const dd=parseInt(m[1],10), mm=parseInt(m[2],10), yyyy=parseInt(m[3],10);
  if(dd<1||dd>31||mm<1||mm>12||yyyy<1900||yyyy>2025){ showErr('Das Geburtsdatum scheint nicht zu stimmen. Bitte prüfe Tag, Monat und Jahr.'); return; }
  state.firstName=fn; state.lastName=ln; state.birthDate=bd;
  const digits=m[1]+m[2]+m[3];
  state.code=computeCode(digits);
  renderIntro();
};

  const a=arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }

  else{ showStatus('warning','Noch nicht ganz','Die rot hinterlegten Zeilen stimmen noch nicht. Korrigiere sie und prüfe erneut.'); setTimeout(()=>{ PUZZLE_R5.forEach(it=>document.getElementById('r5row-'+it.id).classList.remove('correct','incorrect')); },4500); }
};

/* ---------- Room 6: Multi-Select + Schlussstein-Eingabe ---------- */
const PUZZLE_R6=[
  {id:'a1', text:'Senkung der Unternehmenssteuern', correct:true, expl:'Angebotsorientiert: verbessert die Produktionsbedingungen.'},
  {id:'a2', text:'Bürokratieabbau / Deregulierung', correct:true, expl:'Angebotsorientiert: erleichtert das Wirtschaften.'},
  {id:'a3', text:'Flexibilisierung des Arbeitsmarktes', correct:true, expl:'Angebotsorientiert: setzt an der Angebotsseite an.'},
  {id:'a4', text:'Sicherung der Geldwertstabilität', correct:true, expl:'Angebotsorientiert: stabile Rahmenbedingungen.'},
  {id:'n1', text:'Höhere Sozialleistungen, um die Nachfrage zu beleben', correct:false, expl:'Nachfrageorientiert, nicht angebotsorientiert.'},
  {id:'n2', text:'Kurzfristiges Konjunkturprogramm zur Stützung der Nachfrage', correct:false, expl:'Nachfrageorientiert, nicht angebotsorientiert.'},
];
let r6Selected=new Set(); let r6Submitted=false; let r6Order=[];
function normalizeAnswer(s){ return (s||'').toLowerCase().replace(/[^a-zäöüß ]/g,'').replace(/\s+/g,' ').trim(); }
const R6_KEYSTONE_ACCEPT=['soziale marktwirtschaft','sozialen marktwirtschaft','die soziale marktwirtschaft'];
function renderRoom6(){
  state.screen='room6'; renderSeals(); window.scrollTo({top:0,behavior:'instant'});
  r6Selected=new Set(); r6Submitted=false;
  r6Order=shuffle(PUZZLE_R6);
  const room=ROOMS[5];
  const cards=r6Order.map(m=>`<button class="multi-card" id="r6-${m.id}" onclick="toggleR6('${m.id}')"><span class="box"></span><span>${m.text}</span></button>`).join('');
  root.innerHTML=`
    ${roomHeader(room)}
    <p class="body-lg" style="margin-bottom:4px;"><strong>Teil 1:</strong> Welche Maßnahmen gehören zur <strong>angebotsorientierten</strong> Politik?</p>
    <div class="multi-grid">${cards}</div>
    <div class="card" style="margin-top:6px;">
      <p class="body-lg" style="margin-bottom:10px;"><strong>Teil 2 · Der Schlussstein.</strong> Wie heißt die übergreifende Wirtschaftsordnung, die du in diesem Escape-Room Stück für Stück aufgebaut hast? (zwei Wörter)</p>
      <input id="r6input" class="text-input" type="text" maxlength="40" placeholder="Antwort eingeben …" style="max-width:360px;" onkeydown="if(event.key==='Enter') checkR6()">
    </div>
    ${roomFooter('Teil 1: Angebotsseite = bessere Produktionsbedingungen (Steuern, Bürokratie, Arbeitsmarkt, stabiles Geld). Teil 2: Es ist der Name der ganzen Ordnung – das Ziel, das Marenia von Anfang an ausgerufen hat.','checkR6()')}`;
}
window.toggleR6=(id)=>{
  if(r6Submitted) return;
  const c=document.getElementById('r6-'+id);
  if(r6Selected.has(id)){ r6Selected.delete(id); c.classList.remove('selected'); }
  else{ r6Selected.add(id); c.classList.add('selected'); }
};
window.checkR6=()=>{
  let perfect=true; const errors=[];
  PUZZLE_R6.forEach(m=>{
    const c=document.getElementById('r6-'+m.id); c.classList.remove('selected','correct','incorrect','missed');
    const sel=r6Selected.has(m.id);
    if(sel&&m.correct) c.classList.add('correct');
    else if(sel&&!m.correct){ c.classList.add('incorrect'); perfect=false; errors.push({kind:'falsch_gewaehlt', item:m.text, explanation:m.expl}); }
    else if(!sel&&m.correct){ c.classList.add('missed'); perfect=false; errors.push({kind:'uebersehen', item:m.text, explanation:m.expl}); }
  });
  const inputEl=document.getElementById('r6input');
  const val=inputEl.value;
  const inputOk=R6_KEYSTONE_ACCEPT.includes(normalizeAnswer(val));
  if(!inputOk){ perfect=false; inputEl.style.borderColor='var(--error)'; errors.push({kind:'falsche_eingabe', item:'Schlussstein: Name der Wirtschaftsordnung', wrongAnswer:val||'(leer)', correctAnswer:'Soziale Marktwirtschaft'}); }
  else inputEl.style.borderColor='var(--success)';
  recordAttempt(5,{errors});
  if(perfect){ r6Submitted=true; showStatus('success','Richtig','Das Dach ist gedeckt, der Schlussstein sitzt. Das Haus der Sozialen Marktwirtschaft steht.'); setTimeout(()=>triggerReveal(5),800); }
  else{ showStatus('warning','Noch nicht ganz','Prüfe Teil 1 (rot = falsch, gold = übersehen) und Teil 2 (der Schlussstein-Begriff).'); setTimeout(()=>{ PUZZLE_R6.forEach(m=>{ const c=document.getElementById('r6-'+m.id); c.classList.remove('correct','incorrect','missed'); if(r6Selected.has(m.id)) c.classList.add('selected'); }); },4500); }
};

/* ============================================================
   REVEAL & ROUTER
   ============================================================ */
function triggerReveal(roomIdx){
  state.solved[roomIdx]=true; state.letters[roomIdx]=CODE_WORD[roomIdx];
  const overlay=document.getElementById('revealOverlay');
  document.getElementById('revealLetter').textContent=CODE_WORD[roomIdx];
  document.getElementById('revealCaption').textContent=`Buchstabe ${roomIdx+1} von 6 freigeschaltet`;
  const progBox=document.getElementById('revealProgress'); progBox.innerHTML='';
  for(let i=0;i<6;i++){ const span=document.createElement('span'); span.className='reveal-progress-letter'+(state.solved[i]?' lit':''); span.textContent=state.solved[i]?CODE_WORD[i]:'·'; progBox.appendChild(span); }
  const btn=document.getElementById('revealContinue'); const isLast=roomIdx===5;
  btn.textContent=isLast?'Gründungsplan ratifizieren':'Nächste Bibliothek betreten';
  btn.onclick=()=>{ overlay.classList.remove('show'); setTimeout(()=>{ if(isLast) renderFinal(); else goLibrary(roomIdx+2); },250); };
  overlay.classList.add('show');
}
window.goRoom=(n)=>{
  window.scrollTo({top:0,behavior:'instant'});
  switch(n){ case 1:renderRoom1();break; case 2:renderRoom2();break; case 3:renderRoom3();break; case 4:renderRoom4();break; case 5:renderRoom5();break; case 6:renderRoom6();break; }
};
