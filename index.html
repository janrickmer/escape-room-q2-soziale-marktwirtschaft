<script>
/* Videos erst nach Klick laden: YouTube-Rahmen tragen ihre Adresse in data-yt-src und zeigen bis zum Klick einen
   Hinweis (srcdoc). Erst „Video laden“ stellt eine Verbindung zu YouTube her (siehe Impressum & Datenschutz). */
(function(){
  function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
  function prep(f){
    var u=f.getAttribute('data-yt-src');
    if(!u||f.hasAttribute('srcdoc')) return;
    var go=u+(u.indexOf('?')<0?'?':'&')+'autoplay=1';
    var t=f.getAttribute('title')||'';
    if(/^YouTube video player$/i.test(t)) t='';
    f.setAttribute('srcdoc','<!doctype html><html lang="de"><head><meta charset="utf-8"><style>'
      +'html,body{margin:0;height:100%}body{display:flex;align-items:center;justify-content:center;background:#1d1d1f;color:#f2f2f2;'
      +'font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;text-align:center}'
      +'.b{max-width:30em;padding:12px 16px}.t{font-weight:600;margin:0 0 10px}'
      +'a{display:inline-block;padding:10px 20px;border-radius:999px;background:#fff;color:#111;font-weight:700;text-decoration:none}'
      +'a:hover,a:focus{background:#ffd75e}p.n{margin:10px 0 0;font-size:12.5px;opacity:.8}'
      +'@media (max-height:210px){body{font-size:12px}.t{display:none}.b{padding:6px 10px}a{padding:7px 14px}p.n{margin-top:6px;font-size:11px;line-height:1.3}}</style></head><body><div class="b">'
      +(t?'<p class="t">'+esc(t)+'</p>':'')
      +'<a href="'+esc(go)+'">&#9654; Video von YouTube laden</a>'
      +'<p class="n">Erst nach diesem Klick wird das Video von YouTube (Google) geladen. Dabei erhält Google unter anderem deine IP-Adresse und kann Cookies setzen; Daten können in die USA gelangen.</p>'
      +'</div></body></html>');
  }
  function scan(n){
    if(n.nodeType!==1) return;
    if(n.tagName==='IFRAME') prep(n);
    else if(n.querySelectorAll){ var l=n.querySelectorAll('iframe[data-yt-src]'); for(var i=0;i<l.length;i++) prep(l[i]); }
  }
  new MutationObserver(function(ms){ ms.forEach(function(m){ m.addedNodes.forEach(scan); }); })
    .observe(document.documentElement,{childList:true,subtree:true});
})();
</script>

/* ============================================================
   STUNDE NULL — Escape Room
   Politik & Wirtschaft · Q-Phase Grundkurs · Soziale Marktwirtschaft
   Helles, seriös-wirtschaftliches Design
   ============================================================ */

:root{
  --bg:           #f4f1ea;
  --bg-soft:      #efeae0;
  --surface:      #ffffff;
  --surface-alt:  #faf8f3;
  --ink:          #1d2733;
  --ink-soft:     #43505f;
  --ink-mute:     #6c7888;
  --primary:      #1f4e5f;   /* tiefes Petrol */
  --primary-dark: #163a47;
  --primary-soft: #e6eef0;
  --accent:       #a9772a;   /* gedämpftes Ocker/Gold */
  --accent-bright:#c08f3e;
  --accent-soft:  #f3ebda;
  --success:      #2f7d41;
  --success-bg:   #e9f3ea;
  --error:        #b1442f;
  --error-bg:     #f8eae6;
  --missed:       #a9772a;
  --missed-bg:    #f6efdf;
  --border:       rgba(29,39,51,0.12);
  --border-soft:  rgba(29,39,51,0.07);
  --shadow-sm:    0 1px 3px rgba(29,39,51,0.07), 0 1px 2px rgba(29,39,51,0.05);
  --shadow-md:    0 6px 24px rgba(29,39,51,0.10), 0 2px 6px rgba(29,39,51,0.06);
  --font-display: 'Fraunces', Georgia, 'Times New Roman', serif;
  --font-body:    'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --font-mono:    'IBM Plex Mono', 'Menlo', 'Courier New', monospace;
}

*{ box-sizing:border-box; margin:0; padding:0; }

html,body{
  background:var(--bg);
  color:var(--ink);
  font-family:var(--font-body);
  font-weight:400;
  line-height:1.65;
  min-height:100vh;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
}
body::before{
  content:'';
  position:fixed; inset:0; z-index:-2;
  background:
    radial-gradient(ellipse at 12% 8%, rgba(31,78,95,0.06) 0%, transparent 45%),
    radial-gradient(ellipse at 90% 92%, rgba(169,119,42,0.06) 0%, transparent 45%),
    linear-gradient(180deg, var(--bg) 0%, var(--bg-soft) 100%);
  pointer-events:none;
}

.app{ min-height:100vh; display:flex; flex-direction:column; }

/* ---------- Topbar ---------- */
.topbar{
  position:sticky; top:0; z-index:50;
  background:rgba(255,255,255,0.88);
  backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border-soft);
  padding:12px 26px;
  display:flex; align-items:center; justify-content:space-between; gap:20px;
}
.topbar-brand{
  display:flex; align-items:center; gap:11px;
  font-family:var(--font-display); font-weight:600; font-size:15px;
  color:var(--primary); letter-spacing:0.01em;
}
.topbar-brand svg{ width:24px; height:24px; stroke:var(--primary); fill:none; }
.topbar-progress{ display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
.seal{
  width:30px; height:30px; border-radius:50%;
  border:1.5px solid var(--border); background:var(--surface);
  display:flex; align-items:center; justify-content:center;
  font-family:var(--font-mono); font-size:11px; font-weight:600;
  color:var(--ink-mute); transition:all .35s cubic-bezier(.4,0,.2,1);
}
.seal.library{
  width:11px; height:11px; border-radius:2px; border:1.5px solid var(--border);
  background:transparent;
}
.seal.library.active{ border-color:var(--primary); background:var(--primary); }
.seal.library.visited{ border-color:var(--accent); background:var(--accent); }
.seal.active{ border-color:var(--primary); color:var(--primary); box-shadow:0 0 0 3px var(--primary-soft); }
.seal.solved{
  background:var(--accent); border-color:var(--accent); color:#fff;
  font-family:var(--font-display); font-weight:700; font-size:14px; transform:rotate(-3deg);
}

/* ---------- Layout ---------- */
.main{ flex:1; display:flex; align-items:flex-start; justify-content:center; padding:52px 22px 64px; }
.screen{ width:100%; max-width:880px; animation:screenIn .55s cubic-bezier(.16,1,.3,1) both; }
@keyframes screenIn{ from{opacity:0; transform:translateY(18px);} to{opacity:1; transform:translateY(0);} }

.site-footer{
  text-align:center; font-size:11px; color:var(--ink-mute);
  padding:18px 12px 22px; border-top:1px solid var(--border-soft);
  font-family:var(--font-mono); letter-spacing:0.02em;
}

/* ---------- Typography ---------- */
h1,h2,h3{ font-family:var(--font-display); font-weight:600; line-height:1.15; color:var(--ink); letter-spacing:-0.01em; }
.kicker{
  font-family:var(--font-mono); font-size:11px; font-weight:600; letter-spacing:0.18em;
  text-transform:uppercase; color:var(--accent); margin-bottom:14px;
  display:flex; align-items:center; gap:11px;
}
.kicker::before{ content:''; width:26px; height:1px; background:var(--accent); display:inline-block; }
.title-mega{ font-size:clamp(40px,7vw,68px); font-weight:600; line-height:1; margin-bottom:20px; letter-spacing:-0.025em; }
.title-mega em{ font-style:italic; font-weight:400; color:var(--primary); }
.lede{ font-family:var(--font-display); font-size:clamp(17px,2vw,21px); font-weight:400; line-height:1.5; color:var(--ink-soft); max-width:60ch; margin-bottom:28px; }
.section-title{ font-size:clamp(28px,4vw,40px); font-weight:600; margin-bottom:8px; }
p{ margin-bottom:14px; }
p.body-lg{ font-size:16.5px; line-height:1.7; }
.text-mute{ color:var(--ink-mute); }

/* ---------- Cards ---------- */
.card{
  background:var(--surface); border:1px solid var(--border-soft);
  border-radius:8px; padding:30px 34px; margin-bottom:22px; box-shadow:var(--shadow-sm); position:relative;
}
.card-accent::before{
  content:''; position:absolute; left:0; top:22px; bottom:22px; width:3px;
  background:var(--accent); border-radius:0 2px 2px 0;
}
.briefing{ font-family:var(--font-display); font-style:italic; font-size:17px; line-height:1.7; color:var(--ink); padding-left:18px; }
.briefing .speaker{
  display:block; font-family:var(--font-mono); font-style:normal; font-size:10px; font-weight:600;
  letter-spacing:0.18em; text-transform:uppercase; color:var(--accent); margin-bottom:8px;
}

/* ---------- Buttons ---------- */
.btn{
  display:inline-flex; align-items:center; gap:9px; padding:13px 26px; border:none; border-radius:4px;
  font-family:var(--font-body); font-size:13.5px; font-weight:600; letter-spacing:0.02em;
  cursor:pointer; transition:all .22s cubic-bezier(.4,0,.2,1); text-decoration:none;
}
.btn-primary{ background:var(--primary); color:#fff; }
.btn-primary:hover{ background:var(--primary-dark); transform:translateY(-1px); box-shadow:var(--shadow-md); }
.btn-ghost{ background:transparent; color:var(--primary); border:1.5px solid var(--border); }
.btn-ghost:hover{ border-color:var(--primary); }
.btn-arrow::after{ content:'\2192'; font-family:var(--font-mono); font-size:15px; }
.btn-row{ display:flex; gap:14px; flex-wrap:wrap; margin-top:22px; align-items:center; }

/* ---------- Inputs ---------- */
.field-label{ display:block; font-family:var(--font-mono); font-size:10px; font-weight:600; letter-spacing:0.16em; text-transform:uppercase; color:var(--accent); margin-bottom:6px; }
.text-input{
  width:100%; padding:12px 14px; background:var(--surface-alt); border:1.5px solid var(--border);
  border-radius:4px; color:var(--ink); font-family:var(--font-body); font-size:15px;
}
.text-input:focus{ outline:none; border-color:var(--primary); background:#fff; }
.input-error{ display:none; margin-top:14px; padding:10px 14px; background:var(--error-bg); border-left:3px solid var(--error); color:var(--ink); font-size:13px; border-radius:4px; }

/* ---------- Room header ---------- */
.room-header{ display:flex; align-items:flex-start; gap:18px; margin-bottom:18px; }
.room-number{ font-family:var(--font-display); font-size:46px; font-weight:600; color:var(--accent); line-height:0.9; }
.room-location{ font-family:var(--font-mono); font-size:11px; letter-spacing:0.14em; text-transform:uppercase; color:var(--ink-mute); }
.room-name{ font-family:var(--font-display); font-size:26px; font-weight:600; color:var(--ink); }

/* ---------- Library ---------- */
.library-banner{
  display:flex; gap:14px; align-items:flex-start; background:var(--primary-soft);
  border:1px solid rgba(31,78,95,0.18); border-radius:8px; padding:16px 18px; margin-bottom:26px;
}
.library-banner svg{ width:22px; height:22px; stroke:var(--primary); fill:none; flex-shrink:0; margin-top:2px; }
.library-banner .warn{ display:block; margin-top:6px; color:var(--primary-dark); font-weight:600; font-size:13.5px; }
.lib-section{ margin-bottom:22px; }
.lib-section-title{ font-family:var(--font-display); font-size:19px; font-weight:600; color:var(--primary); margin-bottom:8px; }
.lib-bullets{ margin:8px 0 0 20px; }
.lib-bullets li{ margin-bottom:7px; }
.lib-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:12px; margin-top:12px; }
@media(max-width:600px){ .lib-grid{ grid-template-columns:1fr; } }
.lib-card{ background:var(--surface-alt); border:1px solid var(--border-soft); border-radius:6px; padding:14px 16px; }
.lib-card-sub{ font-family:var(--font-mono); font-size:9.5px; letter-spacing:0.12em; text-transform:uppercase; color:var(--accent); }
.lib-card-title{ font-family:var(--font-display); font-size:16px; font-weight:600; margin:2px 0 5px; }
.lib-card-body{ font-size:13.5px; color:var(--ink-soft); }
.lib-table{ width:100%; border-collapse:collapse; margin-top:10px; font-size:14px; }
.lib-table th,.lib-table td{ text-align:left; padding:9px 11px; border-bottom:1px solid var(--border-soft); }
.lib-table th{ font-family:var(--font-mono); font-size:10px; letter-spacing:0.1em; text-transform:uppercase; color:var(--ink-mute); }
.lib-warning-bar{
  display:flex; gap:12px; align-items:center; background:var(--accent-soft);
  border:1px solid rgba(169,119,42,0.3); border-radius:8px; padding:14px 18px; margin:22px 0;
}
.lib-warning-bar svg{ width:22px; height:22px; stroke:var(--accent); fill:none; flex-shrink:0; }

/* ---------- Video ---------- */
.video-wrap{ position:relative; width:100%; padding-top:56.25%; border-radius:8px; overflow:hidden; box-shadow:var(--shadow-md); background:#000; margin:8px 0 8px; }
.video-wrap iframe{ position:absolute; inset:0; width:100%; height:100%; border:0; }
.fallback-line{ display:flex; gap:14px; flex-wrap:wrap; align-items:center; margin-top:14px; font-size:14px; color:var(--ink-soft); }

/* ---------- Puzzle: single choice ---------- */
.mc-question{ margin-bottom:24px; }
.mc-q-text{ font-weight:600; font-size:16px; margin-bottom:12px; }
.mc-option{
  display:flex; align-items:flex-start; gap:11px; width:100%; text-align:left;
  padding:13px 16px; margin-bottom:9px; background:var(--surface); border:1.5px solid var(--border);
  border-radius:6px; cursor:pointer; font-size:14.5px; line-height:1.5; transition:all .18s ease; font-family:var(--font-body); color:var(--ink);
}
.mc-option:hover{ border-color:var(--primary); }
.mc-option .dot{ width:18px; height:18px; border-radius:50%; border:2px solid var(--border); flex-shrink:0; margin-top:1px; }
.mc-option.selected{ border-color:var(--primary); background:var(--primary-soft); }
.mc-option.selected .dot{ border-color:var(--primary); background:var(--primary); box-shadow:inset 0 0 0 3px var(--surface); }
.mc-option.correct{ border-color:var(--success); background:var(--success-bg); }
.mc-option.incorrect{ border-color:var(--error); background:var(--error-bg); }

/* ---------- Puzzle: lückentext + matching dropdowns ---------- */
.cloze{ font-size:16px; line-height:2.2; }
.cloze select, .match-select{
  font-family:var(--font-body); font-size:14px; font-weight:600; color:var(--primary);
  background:var(--accent-soft); border:1.5px solid var(--accent); border-radius:5px; padding:4px 8px; margin:0 2px;
}
.cloze select.ok, .match-select.ok{ border-color:var(--success); background:var(--success-bg); color:var(--success); }
.cloze select.bad, .match-select.bad{ border-color:var(--error); background:var(--error-bg); color:var(--error); }
.match-row{ display:flex; align-items:center; gap:14px; padding:12px 0; border-bottom:1px solid var(--border-soft); flex-wrap:wrap; }
.match-left{ flex:1; min-width:200px; font-weight:600; font-size:15px; }
.match-left .lc-sub{ display:block; font-weight:400; font-size:13px; color:var(--ink-mute); }

/* ---------- Puzzle: multi-select grid ---------- */
.multi-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:11px; margin:20px 0; }
@media(max-width:600px){ .multi-grid{ grid-template-columns:1fr; } }
.multi-card{
  display:flex; align-items:flex-start; gap:11px; padding:15px 16px; background:var(--surface);
  border:1.5px solid var(--border); border-radius:6px; cursor:pointer; font-size:14px; line-height:1.45;
  text-align:left; transition:all .18s ease; font-family:var(--font-body); color:var(--ink);
}
.multi-card:hover{ border-color:var(--primary); }
.multi-card .box{ width:18px; height:18px; border-radius:4px; border:2px solid var(--border); flex-shrink:0; margin-top:1px; }
.multi-card.selected{ border-color:var(--primary); background:var(--primary-soft); }
.multi-card.selected .box{ border-color:var(--primary); background:var(--primary); }
.multi-card.correct{ border-color:var(--success); background:var(--success-bg); }
.multi-card.incorrect{ border-color:var(--error); background:var(--error-bg); }
.multi-card.missed{ border-color:var(--missed); background:var(--missed-bg); }

/* ---------- Puzzle: classify rows ---------- */
.classify-row{ display:flex; align-items:center; gap:12px; padding:12px 0; border-bottom:1px solid var(--border-soft); flex-wrap:wrap; }
.classify-text{ flex:1; min-width:210px; font-size:14.5px; }
.classify-btns{ display:flex; gap:8px; }
.classify-btn{
  font-family:var(--font-body); font-size:12.5px; font-weight:600; padding:8px 14px; border-radius:5px;
  border:1.5px solid var(--border); background:var(--surface); color:var(--ink-soft); cursor:pointer; transition:all .18s ease;
}
.classify-btn:hover{ border-color:var(--primary); }
.classify-btn.active{ border-color:var(--primary); background:var(--primary); color:#fff; }
.classify-row.correct{ background:var(--success-bg); }
.classify-row.incorrect{ background:var(--error-bg); }

/* ---------- Status / hint ---------- */
.status{ padding:14px 18px; border-radius:6px; margin:18px 0; font-size:14px; display:none; }
.status.show{ display:block; animation:screenIn .3s ease both; }
.status .label{ display:block; font-family:var(--font-mono); font-size:10px; font-weight:600; letter-spacing:0.14em; text-transform:uppercase; margin-bottom:4px; }
.status-success{ background:var(--success-bg); border-left:3px solid var(--success); }
.status-success .label{ color:var(--success); }
.status-warning{ background:var(--error-bg); border-left:3px solid var(--error); }
.status-warning .label{ color:var(--error); }
.hint-box{ display:none; background:var(--surface-alt); border:1px dashed var(--border); border-radius:6px; padding:14px 18px; margin-top:16px; font-size:14px; color:var(--ink-soft); }
.hint-box.show{ display:block; }
.hint-box .label{ display:block; font-family:var(--font-mono); font-size:10px; font-weight:600; letter-spacing:0.14em; text-transform:uppercase; color:var(--accent); margin-bottom:5px; }
.hint-btn{ background:none; border:none; color:var(--primary); font-family:var(--font-body); font-size:13px; font-weight:600; cursor:pointer; text-decoration:underline; }

/* ---------- Reveal overlay ---------- */
.reveal-overlay{ position:fixed; inset:0; z-index:200; background:rgba(22,58,71,0.55); backdrop-filter:blur(4px); display:none; align-items:center; justify-content:center; padding:20px; }
.reveal-overlay.show{ display:flex; animation:screenIn .3s ease both; }
.reveal-card{ background:var(--surface); border-radius:12px; box-shadow:var(--shadow-md); padding:40px 44px; max-width:440px; text-align:center; }
.reveal-letter{ font-family:var(--font-display); font-size:96px; font-weight:700; color:var(--accent); line-height:1; }
.reveal-caption{ font-family:var(--font-mono); font-size:11px; letter-spacing:0.16em; text-transform:uppercase; color:var(--ink-mute); margin-top:6px; }
.reveal-progress{ display:flex; gap:8px; justify-content:center; margin:22px 0 26px; }
.reveal-progress-letter{ width:38px; height:46px; display:flex; align-items:center; justify-content:center; font-family:var(--font-display); font-size:22px; font-weight:700; color:var(--ink-mute); background:var(--surface-alt); border:1px solid var(--border); border-radius:5px; }
.reveal-progress-letter.lit{ color:#fff; background:var(--accent); border-color:var(--accent); }

/* ---------- Final ---------- */
/* ---------- Zwischenstand-Seite (nach dem letzten Rätselraum, vor dem Finale) ---------- */
.mid-hero{ text-align:center; margin-bottom:18px; }
.mid-hero .section-title{ font-size:clamp(26px,3.6vw,34px); margin-bottom:2px; }
.mid-steps{ display:flex; justify-content:center; align-items:center; gap:10px; flex-wrap:wrap; margin:12px 0 0; }
.mid-step{ display:inline-flex; align-items:center; gap:8px; padding:8px 14px; border-radius:999px; border:1.5px solid var(--border); background:var(--surface); font-family:var(--font-mono); font-size:11px; letter-spacing:.12em; text-transform:uppercase; font-weight:600; color:var(--ink-mute); }
.mid-step.done{ border-color:var(--success); background:var(--success-bg); color:var(--success); }
.mid-step.next{ border-color:var(--primary); background:var(--primary-soft); color:var(--primary-dark); }
.code-badge{ display:inline-flex; align-items:baseline; gap:10px; padding:5px 14px; border-radius:8px; background:var(--surface); border:1.5px solid var(--border); box-shadow:var(--shadow-sm); font-family:var(--font-display); font-size:20px; font-weight:700; letter-spacing:.14em; color:var(--accent); }
.code-badge small{ font-family:var(--font-mono); font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-mute); font-weight:600; }
.pause-card{ margin-top:18px; padding:20px 22px; border:1.5px dashed var(--border); border-radius:8px; background:var(--surface-alt); }
.pause-btn{ display:inline-flex; align-items:center; gap:10px; background:var(--surface); color:var(--primary-dark); border:1.5px solid var(--primary); border-radius:8px; padding:13px 20px; font-family:var(--font-body); font-size:15px; font-weight:600; text-align:left; cursor:pointer; transition:all .2s ease; }
.pause-btn:hover{ background:var(--primary-soft); transform:translateY(-1px); }
.pause-btn svg{ width:20px; height:20px; flex:none; }
.readmore{ display:flex; align-items:center; gap:14px; margin:40px 0 16px; font-family:var(--font-mono); font-size:11px; letter-spacing:.14em; text-transform:uppercase; font-weight:600; color:var(--ink-mute); }
.readmore::before, .readmore::after{ content:''; flex:1; height:1px; background:var(--border); }
.final-actions{ display:grid; gap:14px; }
.final-action{ display:block; width:100%; text-align:left; background:var(--surface-alt); border:1.5px solid var(--border); border-radius:8px; padding:18px 20px; cursor:pointer; transition:all .2s ease; font-family:var(--font-body); }
.final-action:hover{ border-color:var(--primary); box-shadow:var(--shadow-sm); }
.final-action .label{ font-family:var(--font-mono); font-size:10px; letter-spacing:0.14em; text-transform:uppercase; color:var(--accent); font-weight:600; }
.final-action .title{ font-family:var(--font-display); font-size:18px; font-weight:600; color:var(--ink); margin:3px 0 4px; }
.final-action .desc{ font-size:13.5px; color:var(--ink-soft); }
.muted-list{ margin:6px 0 0 18px; }
.muted-list li{ margin-bottom:6px; color:var(--ink-soft); font-size:14px; }

/* Erhard portrait card */
.erhard-card{ display:flex; gap:22px; align-items:flex-start; flex-wrap:wrap; background:var(--surface-alt); border:1px solid var(--border-soft); border-radius:10px; padding:22px 24px; }
.erhard-frame{ width:128px; flex-shrink:0; }
.erhard-frame svg{ width:128px; height:160px; display:block; }
.erhard-cap{ text-align:center; font-family:var(--font-mono); font-size:9px; letter-spacing:0.06em; color:var(--ink-mute); margin-top:6px; }
.erhard-body{ flex:1; min-width:240px; }
.erhard-body h3{ font-size:20px; margin-bottom:2px; }
.erhard-dates{ font-family:var(--font-mono); font-size:11px; letter-spacing:0.1em; color:var(--accent); margin-bottom:10px; }

/* House SVG */
.house-wrap{ text-align:center; margin:10px 0 4px; }
.house-wrap svg{ max-width:440px; width:100%; height:auto; }
.house-wrap.small svg{ max-width:170px; }

/* ---- Arena: das große Finale, der Tunnel zum Feiditor-Feibeitsblatt (bewusst dunkel, dramatisch, unabhängig vom Farbschema) ---- */
.arena{ background:radial-gradient(120% 90% at 50% 0%, #17223a 0%, #0b1220 55%, #070c16 100%); color:#e9eef7; border-radius:14px; padding:26px 28px 26px; margin-top:22px; box-shadow:0 18px 50px rgba(0,0,0,.45); border:1px solid rgba(255,255,255,.06); }
.arena-kicker{ font-family:var(--font-mono); font-size:11px; letter-spacing:.28em; text-transform:uppercase; color:#d6b25e; font-weight:600; text-align:center; }
.arena h2{ font-family:var(--font-display); font-size:26px; font-weight:700; color:#fff; text-align:center; margin:6px 0 14px; letter-spacing:.01em; }
.arena .video-wrap{ max-width:760px; margin:0 auto; }
/* YouTube-Ausweichlink direkt unter dem Video: hell auf dunklem Grund */
.arena .fallback-line{ justify-content:center; max-width:760px; margin:12px auto 18px; color:#b9c4d8; }
.arena .fallback-line .btn-ghost{ color:#f0cf78; border-color:rgba(240,207,120,.5); }
.arena .fallback-line .btn-ghost:hover{ color:#1a1305; background:#f0cf78; border-color:#f0cf78; }
.arena p{ max-width:620px; margin:0 auto 22px; text-align:center; font-size:15px; line-height:1.6; color:#b9c4d8; }
.arena-gate{ display:block; width:100%; max-width:760px; margin:0 auto; padding:0; border:0; background:transparent; cursor:pointer; position:relative; border-radius:12px; overflow:hidden; outline:none; }
.arena-gate svg{ display:block; width:100%; height:auto; }
.arena-gate .gate-glow{ opacity:0; transition:opacity .4s ease; }
.arena-gate:hover .gate-glow, .arena-gate:focus-visible .gate-glow{ opacity:1; }
.arena-gate .gate-field{ transition:filter .3s ease; }
.arena-gate:hover .gate-field{ filter:brightness(1.2); }
.arena-gate:focus-visible{ box-shadow:0 0 0 3px #d6b25e; }
/* Button im Gang: sitzt unten über dem Bild, der ganze Gang ist klickbar */
.arena-enter{ position:absolute; left:50%; bottom:22px; transform:translateX(-50%); display:inline-flex; align-items:center; gap:10px; background:linear-gradient(135deg,#f0cf78,#d6b25e); color:#1a1305; font-family:var(--font-body); font-size:15.5px; font-weight:700; padding:14px 26px; border-radius:999px; box-shadow:0 8px 24px rgba(0,0,0,.55); white-space:nowrap; pointer-events:none; transition:transform .2s ease, box-shadow .2s ease; }
.arena-gate:hover .arena-enter, .arena-gate:focus-visible .arena-enter{ transform:translateX(-50%) translateY(-3px); box-shadow:0 12px 30px rgba(0,0,0,.6); }
.arena-enter svg{ width:18px; height:18px; flex:none; }
/* Hinweis unter dem Tor (schlägt .arena p) */
.arena p.gate-hint{ max-width:620px; margin:16px auto 0; text-align:center; font-size:13px; line-height:1.55; color:#aab6cc; }
/* Vorbereitungs-Kasten in der Arena: hell auf dunklem Grund */
.prep{ max-width:760px; margin:0 auto 22px; padding:22px 24px; background:var(--surface); color:var(--ink); border-radius:12px; text-align:left; }
.prep h3{ font-size:18px; margin-bottom:10px; }
.prep ol{ margin:0; padding-left:1.3em; display:grid; gap:14px; }
.prep li{ font-size:14.5px; line-height:1.6; color:var(--ink-soft); }
.prep li::marker{ font-weight:700; color:var(--accent); }
.prep li strong{ color:var(--ink); }
.prep .btn-row{ margin-top:12px; }
/* Icons in Knöpfen begrenzen */
.btn svg{ width:18px; height:18px; flex:none; }
/* Meldungen unter den Knöpfen (statt alert) */
.msg{ margin-top:10px; font-size:13.5px; font-weight:600; line-height:1.45; color:var(--ink-soft); }
.msg:empty{ display:none; }
.msg.is-err{ padding:10px 14px; background:var(--error-bg); border-left:3px solid var(--error); color:var(--ink); border-radius:6px; }
.arena p.msg{ max-width:620px; margin:12px auto 0; text-align:center; font-size:13.5px; color:#f3e6c0; }
.arena p.msg.is-err{ padding:10px 14px; background:rgba(214,69,69,.2); border-left:3px solid #ff9c9c; color:#ffe3e3; text-align:left; border-radius:6px; }
.arena .prep p.msg{ max-width:none; margin:10px 0 0; text-align:left; color:var(--ink-soft); }
.arena .prep p.msg.is-err{ background:var(--error-bg); border-left-color:var(--error); color:var(--ink); }
/* Gesperrtes Finale: Hinweis (schlägt .arena p), Speicher-Knopf, graues Tor */
.arena p.gate-locked{ display:grid; grid-template-columns:auto minmax(0,1fr); gap:12px; align-items:start; max-width:760px; margin:0 auto; padding:14px 16px; background:rgba(240,207,120,.12); border:1px solid rgba(240,207,120,.45); border-radius:10px; color:#f3e6c0; font-size:14px; font-weight:600; line-height:1.5; text-align:left; }
.gate-locked svg{ width:22px; height:22px; margin-top:1px; flex:none; color:#f0cf78; }
.gate-locked:focus{ outline:3px solid #f0cf78; outline-offset:3px; }
.gate-save{ justify-content:center; margin:12px auto 0; }
.arena .save-btn{ background:transparent; color:#f0cf78; border-color:rgba(240,207,120,.5); }
.arena .save-btn:hover{ border-color:#f0cf78; color:#fff; box-shadow:none; }
.arena-gate{ margin-top:22px; }
.arena-gate[aria-disabled="true"]{ cursor:not-allowed; filter:grayscale(1); opacity:.65; }
.arena-gate[aria-disabled="true"]:hover .gate-glow, .arena-gate[aria-disabled="true"]:focus-visible .gate-glow{ opacity:0; }
.arena-gate[aria-disabled="true"]:hover .gate-field{ filter:none; }
.arena-gate[aria-disabled="true"]:hover .arena-enter, .arena-gate[aria-disabled="true"]:focus-visible .arena-enter{ transform:translateX(-50%); box-shadow:0 8px 24px rgba(0,0,0,.55); }
.arena-gate[aria-disabled="true"] .arena-enter{ background:#cfd4de; color:#2a3142; }
/* Pause-Karte und Speicherleiste im Finale */
.save-lead{ margin:26px 0 0; font-size:13.5px; font-weight:600; color:var(--ink-soft); }
[data-save-slot] .save-bar{ margin-top:8px; padding-top:0; border-top:0; }
/* Rückfrage-Dialog vor dem Tunnel */
dialog{ width:min(460px,calc(100vw - 32px)); max-width:none; max-height:calc(100dvh - 32px); margin:auto; padding:26px 28px; overflow:auto; border:0; border-radius:12px; background:var(--surface); color:var(--ink); box-shadow:var(--shadow-md); font-family:var(--font-body); }
dialog::backdrop{ background:rgba(22,58,71,.55); }
.dlg-title{ font-size:21px; margin-bottom:10px; }
dialog p{ font-size:14.5px; line-height:1.55; color:var(--ink-soft); margin:0; }
.dlg-actions{ display:flex; flex-wrap:wrap; gap:12px; margin-top:20px; }
.dlg-actions .btn{ flex:1 1 auto; justify-content:center; }
@media (max-width:420px){ dialog{ padding:20px; } .dlg-actions .btn{ width:100%; } }
/* Anmeldung: Felder im Raster; nur für Screenreader */
.form-grid{ display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:16px; }
@media (max-width:560px){ .form-grid{ grid-template-columns:1fr; } }
.sr-only{ position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
@media (max-width:600px){ .arena{ padding:26px 16px 22px; } .arena h2{ font-size:24px; } .arena-enter{ white-space:normal; text-align:center; width:max-content; max-width:92%; font-size:13px; line-height:1.25; padding:10px 16px; bottom:12px; gap:6px; } .prep{ padding:18px 16px; } }

/* ---------- Zwischenstand speichern / laden ---------- */
.save-bar{ display:flex; justify-content:flex-start; margin-top:44px; padding-top:18px; border-top:1px dashed var(--border); }
.save-btn{ display:inline-flex; align-items:center; gap:9px; padding:11px 18px; background:var(--surface); color:var(--ink-soft); border:1.5px solid var(--border); border-radius:4px; font-family:var(--font-body); font-size:13.5px; font-weight:600; letter-spacing:0.02em; cursor:pointer; transition:all .22s cubic-bezier(.4,0,.2,1); }
.save-btn:hover{ border-color:var(--primary); color:var(--primary); box-shadow:var(--shadow-sm); }

function computeCode(birthDigits){
  // birthDigits = "TTMMJJJJ"
  const n = parseInt(birthDigits, 10);
  return String(n * 1104 + MAGIC);
}
// Eingaben: Unicode normalisieren, Steuerzeichen entfernen, Leerraum zusammenfassen
function cleanInput(s){
  return String(s == null ? '' : s).normalize('NFC').replace(/[\u0000-\u001F\u007F-\u009F]/g, '').replace(/\s+/g, ' ').trim();
}
const normKlasse = v => String(v || '').replace(/[\s.]+/g, '');
// Einstellige Tage und Monate ergänzen: „4.5.2010“ → „04.05.2010“
function padBirth(v){
  const m=/^(\d{1,2})\.(\d{1,2})\.(\d{4})$/.exec(v);
  return m ? m[1].padStart(2,'0')+'.'+m[2].padStart(2,'0')+'.'+m[3] : v;
}
// Lässt sich der Text in der Überblick-PDF (WinAnsi) darstellen? Zeichen ohne Entsprechung würden dort zu „?“.
function pdfPrintable(s){
  const q=(String(s).match(/\?/g)||[]).length;
  return encodeWinAnsi(s).filter(b=>b===0x3F).length===q;
}

/* ============================================================

   ============================================================ */
const WIN_ANSI_MAP = {
  'ä':0xE4,'ö':0xF6,'ü':0xFC,'Ä':0xC4,'Ö':0xD6,'Ü':0xDC,'ß':0xDF,
  '€':0x80,'‚':0x82,'„':0x84,'…':0x85,'†':0x86,'‡':0x87,
  '‰':0x89,'‹':0x8B,"\u2018":0x91,"\u2019":0x92,"\u201C":0x93,"\u201D":0x94,
  '•':0x95,'–':0x96,'—':0x97,'™':0x99,'›':0x9B,
  '¡':0xA1,'«':0xAB,'»':0xBB,'·':0xB7,'×':0xD7,'°':0xB0,
  '²':0xB2,'³':0xB3,'½':0xBD,'¼':0xBC,'¾':0xBE,'¿':0xBF,
};
const FALLBACK_MAP = {
  '→':'->','←':'<-','↑':'^','↓':'v','✓':'v','✗':'x','✕':'x','★':'*','☆':'*',
  '\u00A0':' ','\u2009':' ','\u200B':'',
};
const PDF_TRANSLIT = { 'Ł':'L','ł':'l','Đ':'D','đ':'d','ı':'i','Œ':'OE','œ':'oe',
  '₀':'0','₁':'1','₂':'2','₃':'3','₄':'4','₅':'5','₆':'6','₇':'7','₈':'8','₉':'9' };
function encodeWinAnsi(str){
  const bytes=[];
  for(const ch of String(str)){
    const code=ch.charCodeAt(0);
    if(code<128) bytes.push(code);
    else if(WIN_ANSI_MAP[ch]!==undefined) bytes.push(WIN_ANSI_MAP[ch]);
    else if(FALLBACK_MAP[ch]!==undefined){ for(const sub of FALLBACK_MAP[ch]) bytes.push(sub.charCodeAt(0)&0xFF); }
    else if(code<=255) bytes.push(code);
    else {
      const base=ch.normalize('NFD').charAt(0);   // z. B. ş → s, ř → r, Ś → S
      if(base!==ch && base.charCodeAt(0)<=255) bytes.push(...encodeWinAnsi(base));
      else if(PDF_TRANSLIT[ch]!==undefined){ for(const sub of PDF_TRANSLIT[ch]) bytes.push(sub.charCodeAt(0)); }
      else bytes.push(0x3F);
    }
  }
  return bytes;
}
const HELV_W=(()=>{
  const w=new Array(256).fill(500);
  const widths={' ':278,'!':278,'"':355,'#':556,'$':556,'%':889,'&':667,"'":191,'(':333,')':333,'*':389,'+':584,',':278,'-':333,'.':278,'/':278,'0':556,'1':556,'2':556,'3':556,'4':556,'5':556,'6':556,'7':556,'8':556,'9':556,':':278,';':278,'<':584,'=':584,'>':584,'?':556,'@':1015,'A':667,'B':667,'C':722,'D':722,'E':667,'F':611,'G':778,'H':722,'I':278,'J':500,'K':667,'L':556,'M':833,'N':722,'O':778,'P':667,'Q':778,'R':722,'S':667,'T':611,'U':722,'V':667,'W':944,'X':667,'Y':667,'Z':611,'[':278,'\\':278,']':278,'^':469,'_':556,'`':333,'a':556,'b':556,'c':500,'d':556,'e':556,'f':278,'g':556,'h':556,'i':222,'j':222,'k':500,'l':222,'m':833,'n':556,'o':556,'p':556,'q':556,'r':333,'s':500,'t':278,'u':556,'v':500,'w':722,'x':500,'y':500,'z':500,'{':334,'|':260,'}':334,'~':584,'ä':556,'ö':556,'ü':556,'Ä':667,'Ö':778,'Ü':722,'ß':611,'€':556,'–':556,'—':1000,'«':556,'»':556,'·':278,'°':400,'•':350,
    '„':333,'“':333,'”':333,'‚':222,'‘':222,'’':222,'…':1000,'×':584,'²':333,'³':333,'½':834,'¼':834,'¾':834,
    'Œ':1000,'œ':944,'Š':667,'š':500,'Ž':611,'ž':500,'Ÿ':667,'é':556,'è':556,'ê':556,'á':556,'à':556,'â':556,'ó':556,'ò':556,'ô':556,'í':278,'ì':278,'î':278,'ú':556,'ù':556,'û':556,'ç':500,'ñ':556,'É':667,'È':667,'Á':667,'Ç':722,'Ñ':722};
  for(const k in widths){ const code=WIN_ANSI_MAP[k]!==undefined?WIN_ANSI_MAP[k]:k.charCodeAt(0); if(code<256) w[code]=widths[k]; }
  return w;
})();
// Helvetica-Bold: Breiten aus den Adobe-Metriken (AFM); vorher geschätzt als „normal × 1,04“ – zu schmal (Text ragte über den Rand)
const HELV_BW=(()=>{
  const w=new Array(256).fill(556);
  const widths={' ':278,'!':333,'"':474,'#':556,'$':556,'%':889,'&':722,"'":238,'(':333,')':333,'*':389,'+':584,',':278,'-':333,'.':278,'/':278,'0':556,'1':556,'2':556,'3':556,'4':556,'5':556,'6':556,'7':556,'8':556,'9':556,':':333,';':333,'<':584,'=':584,'>':584,'?':611,'@':975,'A':722,'B':722,'C':722,'D':722,'E':667,'F':611,'G':778,'H':722,'I':278,'J':556,'K':722,'L':611,'M':833,'N':722,'O':778,'P':667,'Q':778,'R':722,'S':667,'T':611,'U':722,'V':667,'W':944,'X':667,'Y':667,'Z':611,'[':333,'\\':278,']':333,'^':584,'_':556,'`':333,'a':556,'b':611,'c':556,'d':611,'e':556,'f':333,'g':611,'h':611,'i':278,'j':278,'k':556,'l':278,'m':889,'n':611,'o':611,'p':611,'q':611,'r':389,'s':556,'t':333,'u':611,'v':556,'w':778,'x':556,'y':556,'z':500,'{':389,'|':280,'}':389,'~':584,'ß':611,'€':556,'–':556,'—':1000,'«':556,'»':556,'·':278,'°':400,'•':350,
    '„':500,'“':500,'”':500,'‚':278,'‘':278,'’':278,'…':1000,'×':584,'²':333,'³':333,'½':834,'¼':834,'¾':834,'‰':1000,'†':556,'‡':556,'™':1000,'‹':333,'›':333,'¡':333,'¿':611,
    'Œ':1000,'œ':944,'Æ':1000,'æ':889,'Ø':778,'ø':611,'Ð':722,'ð':611,'Þ':667,'þ':611};
  for(const k in widths){ const code=WIN_ANSI_MAP[k]!==undefined?WIN_ANSI_MAP[k]:k.charCodeAt(0); if(code<256) w[code]=widths[k]; }
  return w;
})();
// Akzentbuchstaben (À … ÿ) so breit wie ihr Grundbuchstabe, sofern nicht eigens angegeben
[HELV_W,HELV_BW].forEach(w=>{ for(let c=0xC0;c<=0xFF;c++){ const ch=String.fromCharCode(c), base=ch.normalize('NFD').charAt(0);
  if(base!==ch && base.charCodeAt(0)<128 && !'ßÆæØøÐðÞþ×÷'.includes(ch)) w[c]=w[base.charCodeAt(0)]; } });
function pdfStringWidth(str,fontSize,isBold){
  const bytes=encodeWinAnsi(str), tab=isBold?HELV_BW:HELV_W; let total=0;
  for(const b of bytes) total += tab[b]||556;
  return total*fontSize/1000;
}
const pdfNum = n => String(Math.round(n*100)/100);
class PdfDoc{
  constructor(){ this.pages=[]; this.pageW=595; this.pageH=842; this.margin=56; this.cursorY=0; this.currentContent=[]; }
  startPage(){ this.cursorY=this.pageH-this.margin; this.currentContent=[]; }
  endPage(){ this.pages.push({content:this.currentContent.join('\n')}); }
  _escapedString(str){
    const bytes=encodeWinAnsi(str); let s='(';
    for(const b of bytes){ if(b===0x28||b===0x29||b===0x5C) s+='\\'; s+=String.fromCharCode(b); }
    return s+')';
  }
  _textCmd(str,x,y,fontSize,isBold,color){
    const fontKey=isBold?'F2':'F1'; const c=color||[0,0,0];
    return `${pdfNum(c[0]/255)} ${pdfNum(c[1]/255)} ${pdfNum(c[2]/255)} rg\nBT\n/${fontKey} ${fontSize} Tf\n${pdfNum(x)} ${pdfNum(y)} Td\n${this._escapedString(str)} Tj\nET`;
  }
  text(str,x,y,fontSize,isBold,color){ this.currentContent.push(this._textCmd(str,x,y,fontSize,isBold,color)); }
  rect(x,y,w,h,fill,stroke){
    let cmd='';
    if(fill) cmd+=`${pdfNum(fill[0]/255)} ${pdfNum(fill[1]/255)} ${pdfNum(fill[2]/255)} rg\n`;
    if(stroke) cmd+=`${pdfNum(stroke[0]/255)} ${pdfNum(stroke[1]/255)} ${pdfNum(stroke[2]/255)} RG\n`;
    cmd+=`${pdfNum(x)} ${pdfNum(y)} ${pdfNum(w)} ${pdfNum(h)} re\n`;
    if(fill&&stroke) cmd+='B'; else if(fill) cmd+='f'; else if(stroke) cmd+='S';
    this.currentContent.push(cmd);
  }
  line(x1,y1,x2,y2,color,width){
    const c=color||[0,0,0];
    this.currentContent.push(`${pdfNum(c[0]/255)} ${pdfNum(c[1]/255)} ${pdfNum(c[2]/255)} RG\n${width||0.5} w\n${pdfNum(x1)} ${pdfNum(y1)} m ${pdfNum(x2)} ${pdfNum(y2)} l S`);
  }
  wrapLines(str,width,fontSize,isBold){
    const out=[]; let line='';
    for(const word of String(str).split(/\s+/)){
      if(!word) continue;
      const test=line?line+' '+word:word;
      if(pdfStringWidth(test,fontSize,isBold)<=width) line=test;
      else { if(line) out.push(line); line=word; }
    }
    if(line) out.push(line);
    return out;
  }
  // wie wrapLines, trennt aber zu lange Wörter (erst nach Bindestrichen, dann zwischen Buchstaben) – nichts ragt über width
  wrapLinesHard(str,width,fontSize,isBold){
    const out=[], fits=t=>pdfStringWidth(t,fontSize,isBold)<=width;
    for(const ln of this.wrapLines(str,width,fontSize,isBold)){
      if(fits(ln)){ out.push(ln); continue; }
      let cur='';
      for(const part of (ln.match(/[^-]*-|[^-]+$/g)||[ln])){   // nach jedem Bindestrich (ohne Lookbehind: ältere Safari)
        if(fits(cur+part)){ cur+=part; continue; }
        if(cur){ out.push(cur); cur=''; }
        if(fits(part)){ cur=part; continue; }
        for(const ch of part){ if(cur && !fits(cur+ch)){ out.push(cur); cur=''; } cur+=ch; }
      }
      if(cur) out.push(cur);
    }
    return out;
  }
  paragraph(str,x,y,width,fontSize,isBold,color,leading){
    if(!leading) leading=fontSize*1.4;
    let curY=y;
    for(const ln of this.wrapLines(str,width,fontSize,isBold)){ this.text(ln,x,curY,fontSize,isBold,color); curY-=leading; }
    return curY;
  }
  // wie paragraph, bricht aber auch mitten im Absatz auf eine neue Seite um (ensureFn liefert die neue y-Position)
  paragraphFlow(str,x,y,width,fontSize,isBold,color,leading,ensureFn){
    if(!leading) leading=fontSize*1.4;
    let curY=y;
    for(const ln of this.wrapLines(str,width,fontSize,isBold)){ curY=ensureFn(curY,leading); this.text(ln,x,curY,fontSize,isBold,color); curY-=leading; }
    return curY;
  }
  // opts: { embed: Uint8Array (Datensatz), link: {rect:[x1,y1,x2,y2], page:0, uri}, title }
  build(opts){
    opts=opts||{};
    const W=this.pageW, M=this.margin, FOOT=[108,120,136], N=this.pages.length;
    const objects=[null,null,
      '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>',
      '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>'];
    const add=s=>{ objects.push(s); return objects.length; };
    const linkId=opts.link ? 4+2*N+1 : 0;
    const linkPage=opts.link ? (opts.link.page||0) : -1;
    const pageIds=[];
    this.pages.forEach((page,i)=>{
      const label='Seite '+(i+1)+' von '+N;
      const foot=this._textCmd('Copyright Jan-Rickmer Feindt',M,32,8.5,false,FOOT)+'\n'
        +this._textCmd(label,W-M-pdfStringWidth(label,8.5,false),32,8.5,false,FOOT);
      const content=page.content+'\n'+foot;
      const contentId=add(`<< /Length ${content.length} >>\nstream\n${content}\nendstream`);
      pageIds.push(add(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${this.pageW} ${this.pageH}] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents ${contentId} 0 R${i===linkPage?` /Annots [${linkId} 0 R]`:''} >>`));
    });
    if(opts.link){
      const r=opts.link.rect.map(pdfNum).join(' ');
      add(`<< /Type /Annot /Subtype /Link /Rect [${r}] /Border [0 0 0] /A << /S /URI /URI ${this._escapedString(opts.link.uri)} >> >>`);
    }
    let specId=0;
    const desc=this._escapedString('Escape-Room '+ESCAPE_ROOM.name);
    if(opts.embed){
      const bytes=opts.embed; let bin='';
      for(let i=0;i<bytes.length;i+=0x8000) bin+=String.fromCharCode.apply(null,bytes.subarray(i,i+0x8000));
      specId=objects.length+1; const fileId=specId+1;
      add(`<< /Type /Filespec /F (feibeitsblatt-escape.json) /UF (feibeitsblatt-escape.json) /Desc ${desc} /AFRelationship /Data /EF << /F ${fileId} 0 R /UF ${fileId} 0 R >> >>`);
      add(`<< /Type /EmbeddedFile /Subtype /application#2Fjson /FbEscape 1 /Params << /Size ${bytes.length} >> /Length ${bytes.length} >>\nstream\n${bin}\nendstream`);
    }
    const now=new Date(), two=n=>String(n).padStart(2,'0');
    const stamp='D:'+now.getFullYear()+two(now.getMonth()+1)+two(now.getDate())+two(now.getHours())+two(now.getMinutes())+two(now.getSeconds());
    let titleHex='FEFF'; for(const ch of String(opts.title||'')){ const c=ch.charCodeAt(0); titleHex+=c.toString(16).toUpperCase().padStart(4,'0'); }
    const infoId=add(`<< /Title <${titleHex}> /Producer ${desc} /CreationDate (${stamp}) >>`);
    objects[1]=`<< /Type /Pages /Kids [${pageIds.map(i=>i+' 0 R').join(' ')}] /Count ${pageIds.length} >>`;
    objects[0]=specId
      ? `<< /Type /Catalog /Pages 2 0 R /Names << /EmbeddedFiles << /Names [(feibeitsblatt-escape.json) ${specId} 0 R] >> >> /AF [${specId} 0 R] >>`
      : '<< /Type /Catalog /Pages 2 0 R >>';
    let pdf='%PDF-1.7\n%\xE2\xE3\xCF\xD3\n'; const offsets=[0];
    for(let i=0;i<objects.length;i++){ offsets.push(pdf.length); pdf+=`${i+1} 0 obj\n${objects[i]}\nendobj\n`; }
    const xrefOffset=pdf.length;
    pdf+=`xref\n0 ${objects.length+1}\n0000000000 65535 f \n`;
    for(let i=1;i<=objects.length;i++) pdf+=String(offsets[i]).padStart(10,'0')+' 00000 n \n';
    pdf+=`trailer\n<< /Size ${objects.length+1} /Root 1 0 R /Info ${infoId} 0 R >>\nstartxref\n${xrefOffset}\n%%EOF\n`;
    return pdf;
  }
}

/* ============================================================

   ============================================================ */
const SOLUTION_NOTES = [

    text:'Die theoretische Grundlage bildet der Ordoliberalismus der Freiburger Schule um Walter Eucken. Sein zentraler Gedanke: Ein freier Markt entsteht und erhält sich nicht von selbst, weil schrankenloser Wettbewerb zur „Vermachtung" (Kartelle, Monopole) führt. Deshalb muss der Staat eine Wettbewerbsordnung bewusst schaffen und schützen. Er setzt dabei nur den Rahmen und greift nicht in einzelne Marktentscheidungen ein – wie ein Schiedsrichter, der die Regeln überwacht, aber nicht selbst mitspielt. Diese Begriffe waren die Lösungen des Lückentextes.' },

function fmtDateTime(d){
  if(!d) d=new Date();
  d=new Date(d);
  const date=d.toLocaleDateString('de-DE');
  const time=d.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'});
  return date+', '+time+' Uhr';
}
function firstTryStats(){
  const totalErrors=state.mistakes.reduce((a,m)=>a+(m&&m.errors?m.errors.length:0),0);
  const perfect=state.attempts.filter((a,i)=>a>=1 && (!state.mistakes[i]||!state.mistakes[i].errors||state.mistakes[i].errors.length===0)).length;
  return { totalErrors, perfect };
}
// Erste Zeile, mit der Überblick-PDF und Datensatz einen Fehler des ersten Versuchs beschreiben (je nach Art des Rätsels)
function errorItemText(e){
  const item=String(e.item==null?'':e.item);
  if(e.kind==='falsch_gewaehlt') return 'Falsch ausgewählt: „'+item+'“';
  if(e.kind==='uebersehen') return 'Übersehen (gehörte dazu): „'+item+'“';
  if(e.kind==='falsch_einsortiert') return '„'+item+'“';
  return item;
}

/* ============================================================
   DATENSATZ FÜR DAS FEIDITOR-FEIBEITSBLATT (Schnittstelle v1)
   ============================================================ */
function fbEscapeHash(str){ // cyrb53-Variante wie saveHash, 64 Bit als 16 Hex-Zeichen
  let h1=0xdeadbeef^str.length, h2=0x41c6ce57^str.length;
  for(let i=0;i<str.length;i++){ const ch=str.charCodeAt(i); h1=Math.imul(h1^ch,2654435761); h2=Math.imul(h2^ch,1597334677); }
  h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);
  h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);
  return (h2>>>0).toString(16).padStart(8,'0')+(h1>>>0).toString(16).padStart(8,'0');
}
function cleanLine(s, max){ return String(s == null ? '' : s).normalize('NFC').replace(/[\u0000-\u001F\u007F]+/g, ' ').replace(/\s+/g, ' ').trim().slice(0, max); }
function cleanText(s, max){ return String(s == null ? '' : s).normalize('NFC').replace(/\r\n?/g, '\n').replace(/[\u0000-\u0009\u000B-\u001F\u007F]+/g, ' ').slice(0, max); }
// Fehler des ersten Versuchs in Textform – derselbe Wortlaut wie in der Überblick-PDF (errorItemText)
function errorToRecord(e){
  const o = { item: cleanLine(errorItemText(e), 2000) };
  if (e.wrongAnswer != null && e.wrongAnswer !== '') o.wrong = cleanLine(e.wrongAnswer, 2000);
  if (e.correctAnswer != null && e.correctAnswer !== '') o.right = cleanLine(e.correctAnswer, 2000);
  if (e.explanation) o.note = cleanLine(e.explanation, 2000);
  return o;
}
function buildEscapeRecord(){
  const iso = d => { const x = new Date(d); return isNaN(x) ? '' : x.toISOString(); };
  const data = {
    code: FB_CODE,
    room: { id: ESCAPE_ROOM.id, name: ESCAPE_ROOM.name, url: ESCAPE_ROOM.url },
    person: { vorname: cleanLine(state.firstName, 60), nachname: cleanLine(state.lastName, 60),
              geburtsdatum: state.birthDate, klasse: state.klasse },
    confirm: String(state.code),
    word: CODE_WORD,
    completedAt: iso(state.completedAt || new Date()),
    stations: ROOM_LABELS.map((label, i) => ({ label, attempts: state.attempts[i],
      errors: ((state.mistakes[i] && state.mistakes[i].errors) || []).slice(0, 30).map(errorToRecord) })),
    notes: SOLUTION_NOTES.map(n => ({ label: n.room, text: cleanText(n.text, 4000) })),
    resumes: (state.resumeLog || []).slice(-20).map(r => ({ place: cleanLine(r.place, 2000), savedAt: iso(r.savedAt), loadedAt: iso(r.loadedAt) })),
  };
  const d = JSON.stringify(data);
  return { kind: 'feibeitsblatt-escape', v: 1, d, s: fbEscapeHash('FbEscape|v1|' + d) };
}
function b64url(str){
  const bytes = new TextEncoder().encode(str); let bin = '';
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}

/* ============================================================
   DOWNLOAD DER ÜBERBLICK-PDF
   ============================================================ */
function translit(s){
  return (s||'').replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue')
    .replace(/Ä/g,'Ae').replace(/Ö/g,'Oe').replace(/Ü/g,'Ue').replace(/ß/g,'ss')
    .replace(/[^a-zA-Z0-9-]/g,'');
}
function overviewFileName(){
  const d=new Date(), two=n=>String(n).padStart(2,'0');
  return `Ueberblick-Escape-Room-${translit(ESCAPE_ROOM.name.replace(/\s+/g,'-'))}-${two(d.getDate())}-${two(d.getMonth()+1)}-${d.getFullYear()}.pdf`;
}
window.downloadOverviewPDF=()=>{
  try{
    const bin=generateOverviewPdf();
    const bytes=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i)&0xFF;
    // application/octet-stream statt application/pdf: Der Browser SPEICHERT die Datei, statt sie anzuzeigen.
    const blob=new Blob([bytes],{type:'application/octet-stream'});
    const url=URL.createObjectURL(blob);
    // Unsichtbarer Link, synchron im Klick-Handler ausgelöst (gilt als Nutzeraktion) – die Datei wird gespeichert, nicht angezeigt.
    const link=document.createElement('a');
    link.href=url; link.download=overviewFileName(); link.style.display='none';
    document.body.appendChild(link);
    link.click();
    // Object-URL lange gültig lassen: iOS liest den Blob erst, wenn der Download-Dialog bestätigt ist.
    setTimeout(()=>{ try{ document.body.removeChild(link); }catch(_){} URL.revokeObjectURL(url); },60000);
    state.pdfDownloaded=true;
    return true;
  }catch(e){ console.error(e); return false; }
};

/* ============================================================

   ============================================================ */
function enterTunnel(force){
  if (!FB_CODE) { const lk=document.getElementById('gateLocked'); if(lk) lk.focus(); return; }
  if (!state.pdfDownloaded && !force) { document.getElementById('tunnelDialog').showModal(); return; }
  const msg=document.getElementById('gateMsg'); if(msg){ msg.textContent=''; msg.className='msg'; }
  try{
    const url=FB_URL + '#escape=' + b64url(JSON.stringify(buildEscapeRecord()));
    leaving=true;
    location.assign(url);
  }catch(e){
    leaving=false; console.error(e);
    if(msg){ msg.className='msg is-err'; msg.textContent='Der Tunnel konnte nicht geöffnet werden. Lade die Seite nicht neu – versuche es noch einmal.'; }
  }
}

const root=document.getElementById('screenContainer');

function renderSeals(){
  sealsBox.innerHTML='';
  for(let i=0;i<6;i++){
    const lib=document.createElement('div'); lib.className='seal library';
    const sc=state.screen;
    const isLibActive = (sc==='lib'+(i+1)) || (sc==='lib2alt' && i===1);
    if(isLibActive) lib.classList.add('active');
    else if(state.solved[i] || sc==='room'+(i+1)
      || (sc.startsWith('room') && parseInt(sc.slice(4))>i+1)
      || (sc.startsWith('lib') && parseInt((sc.match(/\d+/)||[0])[0])>i+1)
      || sc==='final') lib.classList.add('visited');
    sealsBox.appendChild(lib);

    const s=document.createElement('div'); s.className='seal';
    if(state.solved[i]){ s.classList.add('solved'); s.textContent=CODE_WORD[i]; }
    else if(state.screen==='room'+(i+1)){ s.classList.add('active'); s.textContent=i+1; }
    else s.textContent=i+1;
    sealsBox.appendChild(s);
  }
}

          <input id="lastNameInput" class="text-input" type="text" autocomplete="family-name" maxlength="40">
        </div>
        <div>
          <label class="field-label" for="birthInput">Geburtsdatum (TT.MM.JJJJ)</label>
          <input id="birthInput" class="text-input" type="text" inputmode="numeric" maxlength="10" placeholder="TT.MM.JJJJ" autocomplete="bday">
        </div>
        <div>
          <label class="field-label" for="klasseInput">Klasse</label>
          <input id="klasseInput" class="text-input" type="text" maxlength="12" placeholder="z. B. Q2" autocomplete="off" autocapitalize="off" spellcheck="false">
        </div>
      </div>
      <div id="startError" class="input-error" role="alert"></div>
      <div class="btn-row">
        <button type="button" class="btn btn-primary btn-arrow" id="startBtn">Weiter zum Auftrag</button>
      </div>
    </div>
    ${saveLoadFieldHtml()}
  `;
  // Enter springt ins nächste Feld, in der Klasse prüft es die Anmeldung
  const order=['firstNameInput','lastNameInput','birthInput','klasseInput'];
  order.forEach((id,i)=>document.getElementById(id).addEventListener('keydown',e=>{
    if(e.key!=='Enter') return;
    e.preventDefault();
    if(i<order.length-1) document.getElementById(order[i+1]).focus(); else submitStart();
  }));
  const birth=document.getElementById('birthInput');
  birth.addEventListener('input',()=>maskBirth(birth));
  document.getElementById('startBtn').addEventListener('click',()=>submitStart());
  setTimeout(()=>document.getElementById('firstNameInput')?.focus(),100);
}
window.maskBirth=(el)=>{
  let v=el.value.replace(/[^0-9]/g,'').slice(0,8);
  let out=v;
  if(v.length>4) out=v.slice(0,2)+'.'+v.slice(2,4)+'.'+v.slice(4);
  else if(v.length>2) out=v.slice(0,2)+'.'+v.slice(2);
  el.value=out;
};
// Anmeldung prüfen: Namen (lateinische Buchstaben, PDF-darstellbar), echtes Geburtsdatum, Klasse (Pflicht)
window.submitStart=()=>{
  const ids=['firstNameInput','lastNameInput','birthInput','klasseInput'], el=ids.map(id=>document.getElementById(id));
  if(el.some(x=>!x)) return;
  const err=document.getElementById('startError');
  el.forEach(x=>{ x.removeAttribute('aria-invalid'); x.removeAttribute('aria-describedby'); });
  err.textContent=''; err.style.display='none';
  const fail=(x,msg)=>{ err.textContent=msg; err.style.display='block'; x.setAttribute('aria-invalid','true'); x.setAttribute('aria-describedby','startError'); x.focus(); };
  const fn=cleanInput(el[0].value), ln=cleanInput(el[1].value), bd=padBirth(cleanInput(el[2].value).replace(/\s/g,'')), kv=cleanInput(el[3].value);
  const nameOk=s=>s.length>=2 && /\p{L}/u.test(s);
  const NAME_MSG='Bitte trage deinen vollen Vor- und Nachnamen ein (jeweils mindestens 2 Zeichen).';
  const LATIN_MSG='Bitte schreibe deinen Vor- und Nachnamen mit lateinischen Buchstaben – so, wie er in deinem Zeugnis steht.';
  if(!nameOk(fn)) return fail(el[0],NAME_MSG);
  if(!nameOk(ln)) return fail(el[1],NAME_MSG);
  if(!pdfPrintable(fn)) return fail(el[0],LATIN_MSG);
  if(!pdfPrintable(ln)) return fail(el[1],LATIN_MSG);
  if(el[2].value!==bd && /^\d{2}\.\d{2}\.\d{4}$/.test(bd)) el[2].value=bd;
  const m=/^(\d{2})\.(\d{2})\.(\d{4})$/.exec(bd);
  if(!m) return fail(el[2],'Bitte gib dein Geburtsdatum im Format TT.MM.JJJJ ein (z. B. 07.03.2006).');
  const dd=+m[1], mm=+m[2], yy=+m[3], dt=new Date(yy,mm-1,dd), now=new Date();
  if(dt.getFullYear()!==yy||dt.getMonth()!==mm-1||dt.getDate()!==dd||yy<1950||yy>now.getFullYear()||dt>now)
    return fail(el[2],'Das Geburtsdatum scheint nicht zu stimmen. Bitte prüfe Tag, Monat und Jahr.');
  const k=normKlasse(kv);
  if(!k) return fail(el[3],'Bitte gib deine Klasse ein (z. B. Q2).');
  if(!/^[\p{L}\p{N}/-]{1,10}$/u.test(k)) return fail(el[3],'Bitte gib deine Klasse nur mit Buchstaben und Ziffern ein (z. B. Q2).');
  if(!pdfPrintable(k)) return fail(el[3],'Bitte gib deine Klasse mit lateinischen Buchstaben und Ziffern ein (z. B. Q2).');
  state.firstName=fn; state.lastName=ln; state.birthDate=bd; state.klasse=k;
  state.code=computeCode(m[1]+m[2]+m[3]);
  renderIntro();
};

  const a=arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }

  PUZZLE_R5.forEach(it=>{

window.toggleR6=(id)=>{
  if(r6Submitted) return;
  const c=document.getElementById('r6-'+id);

  else{ r6Selected.add(id); c.classList.add('selected'); }

window.checkR6=()=>{
  let perfect=true; const errors=[];
  PUZZLE_R6.forEach(m=>{
    const c=document.getElementById('r6-'+m.id); c.classList.remove('selected','correct','incorrect','missed');
    const sel=r6Selected.has(m.id);
    if(sel&&m.correct) c.classList.add('correct');
    else if(sel&&!m.correct){ c.classList.add('incorrect'); perfect=false; errors.push({kind:'falsch_gewaehlt', item:m.text, explanation:m.expl}); }
    else if(!sel&&m.correct){ c.classList.add('missed'); perfect=false; errors.push({kind:'uebersehen', item:m.text, explanation:m.expl}); }
  });
  const inputEl=document.getElementById('r6input');
  const val=inputEl.value;
  const inputOk=R6_KEYSTONE_ACCEPT.includes(normalizeAnswer(val));
  if(!inputOk){ perfect=false; inputEl.style.borderColor='var(--error)'; errors.push({kind:'falsche_eingabe', item:'Schlussstein: Name der Wirtschaftsordnung', wrongAnswer:val||'(leer)', correctAnswer:'Soziale Marktwirtschaft'}); }
  else inputEl.style.borderColor='var(--success)';
  recordAttempt(5,{errors});
  if(perfect){ r6Submitted=true; showStatus('success','Richtig','Das Dach ist gedeckt, der Schlussstein sitzt. Das Haus der Sozialen Marktwirtschaft steht.'); setTimeout(()=>triggerReveal(5),800); }

};

function triggerReveal(roomIdx){
  state.solved[roomIdx]=true; state.letters[roomIdx]=CODE_WORD[roomIdx];

  document.getElementById('revealLetter').textContent=CODE_WORD[roomIdx];
  document.getElementById('revealCaption').textContent=`Buchstabe ${roomIdx+1} von 6 freigeschaltet`;
  const progBox=document.getElementById('revealProgress'); progBox.innerHTML='';
  for(let i=0;i<6;i++){ const span=document.createElement('span'); span.className='reveal-progress-letter'+(state.solved[i]?' lit':''); span.textContent=state.solved[i]?CODE_WORD[i]:'·'; progBox.appendChild(span); }

  btn.textContent=isLast?'Gründungsplan ratifizieren':'Nächste Bibliothek betreten';

}

/* ---------- Zwischenstand: Anpassung an diesen Escape-Room ---------- */
const SAVE_GAME_TITLE   = 'Stunde Null';                        // Spieltitel (Dateiname & Kopf der Datei)
const SAVE_ROOM_ID      = 'powi-q2-soziale-marktwirtschaft';    // Kennung: Dateien anderer Escape-Rooms werden abgelehnt
const SAVE_CONTAINER_ID = 'screenContainer';                   // Container, dessen Inhalt jeder Bildschirm ersetzt
const SAVE_ROOMS        = 6;                                   // Anzahl der Rätselräume
// Nummer des Bibliotheks- bzw. Rätselraums eines Bildschirms ('lib2alt' = Textfassung von Bibliothek 2), sonst 0
function saveScreenNo(s){
  const m=/^(?:lib(\d+)|room(\d+)|lib(2)alt)$/.exec(s||'');
  const n=m?+(m[1]||m[2]||m[3]):0;
  return n>=1 && n<=SAVE_ROOMS ? n : 0;
}
// Speichern in Bibliotheks- und Rätselräumen ab Nr. 2 (auch in der Textfassung von Bibliothek 2) und im Finale
function saveScreenAllowed(s){ return saveScreenNo(s)>=2 || s==='final'; }
function saveScreenLabel(s){
  const n=saveScreenNo(s);
  if(n) return (/^lib/.test(s)?'Bibliotheksraum ':'Rätselraum ')+n;
  return s==='final'?'Finale':'Einführung';
}
// Rätselraum n richtig gelöst, Enthüllungs-Dialog aber noch nicht erschienen (0,8 s Verzögerung)?
function saveRevealPending(n){ return !state.solved[n-1] && [r1Submitted,r2Submitted,r3Submitted,r4Submitted,r5Submitted,r6Submitted][n-1]===true; }
// Ein bereits gelöster Rätselraum wird nicht erneut gezeigt: weiter wie nach dem Enthüllungs-Dialog.
// Gerade richtig gelöst, die Enthüllung (0,8 s verzögert) steht noch aus: Ergebnis schon jetzt eintragen – wie triggerReveal.
function saveResumeTarget(s){
  const m=/^room(\d+)$/.exec(s||'');
  if(m && saveRevealPending(+m[1])){ state.solved[+m[1]-1]=true; state.letters[+m[1]-1]=CODE_WORD[+m[1]-1]; }
  if(m && state.solved[+m[1]-1]) return +m[1]>=SAVE_ROOMS ? 'final' : 'lib'+(+m[1]+1);
  return s;
}
function saveGoTo(s){
  let m;
  if(s==='final') renderFinal();
  else if(s==='lib2alt') renderLibrary2Alt();
  else if((m=/^lib(\d+)$/.exec(s)) && +m[1]>=1 && +m[1]<=SAVE_ROOMS) renderLibrary(+m[1]-1);
  else if((m=/^room(\d+)$/.exec(s)) && +m[1]>=1 && +m[1]<=SAVE_ROOMS) goRoom(+m[1]);
  else renderIntro();
}
// Zusatzdaten außerhalb von state (hier nicht nötig: Versuche, Fehler im ersten Versuch und Buchstaben stehen in state –
// auch ein gerade gelöster Rätselraum, den saveResumeTarget schon einträgt; beide Teile von Raum 6 werden gemeinsam geprüft)
function saveCollectExtra(){ return {}; }
function saveApplyExtra(extra,data){}

/* ============================================================
   ZWISCHENSTAND ALS DATEI SPEICHERN / AUS DATEI LADEN
   Die Datei (.txt) enthält oben einen lesbaren Hinweistext und
   darunter einen codierten Datenblock mit Prüfsumme. Veränderte,
   beschädigte oder fremde Dateien werden beim Laden abgelehnt.
   Jedes Laden wird in state.resumeLog vermerkt und erscheint am
   Ende der Überblick-PDF (für die Lehrkraft).
   ============================================================ */
const SAVE_FORMAT = 2;   // 2: mit Klasse (Dateien der Fassung 1 werden abgelehnt)
const SAVE_SALT   = 'Zwischenstand|Escape-Room|v1';
const SAVE_BEGIN  = '-----BEGIN ZWISCHENSTAND-----';
const SAVE_END    = '-----END ZWISCHENSTAND-----';
const SAVE_ICON   = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>';
const LOAD_ICON   = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>';

function saveHash(str){ // cyrb53-Variante, 64 Bit als 16 Hex-Zeichen
  let h1=0xdeadbeef^str.length, h2=0x41c6ce57^str.length;
  for(let i=0;i<str.length;i++){ const ch=str.charCodeAt(i); h1=Math.imul(h1^ch,2654435761); h2=Math.imul(h2^ch,1597334677); }
  h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);
  h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);
  return (h2>>>0).toString(16).padStart(8,'0')+(h1>>>0).toString(16).padStart(8,'0');
}
function saveScramble(bytes){ // symmetrisch: dieselbe Funktion codiert und decodiert
  let s=parseInt(saveHash(SAVE_SALT).slice(0,8),16)>>>0;
  const out=new Uint8Array(bytes.length);
  for(let i=0;i<bytes.length;i++){
    s=(s+0x6D2B79F5)>>>0; let t=s;
    t=Math.imul(t^(t>>>15),t|1); t^=t+Math.imul(t^(t>>>7),t|61);
    out[i]=bytes[i]^((t^(t>>>14))&0xFF);
  }
  return out;
}
function saveEncode(data){
  const json=JSON.stringify(data);
  const wrap=JSON.stringify({ f:SAVE_FORMAT, id:SAVE_ROOM_ID, s:saveHash(SAVE_SALT+'|'+SAVE_ROOM_ID+'|'+json), d:json });
  const bytes=saveScramble(new TextEncoder().encode(wrap));
  let bin=''; for(let i=0;i<bytes.length;i+=0x8000) bin+=String.fromCharCode.apply(null,bytes.subarray(i,i+0x8000));
  return btoa(bin).replace(/.{1,76}/g,'$&\r\n').trim();
}
function saveDecode(text){ // wirft Error mit schülergerechter Meldung
  const newer='Diese Zwischenstand-Datei stammt aus einer neueren Version des Escape-Rooms. Bitte lade die Seite neu und versuche es noch einmal.';
  const m=/-----BEGIN ZWISCHENSTAND(?: V(\d+))?-----/.exec(text);   // künftige Formate tragen ihre Nummer im Marker
  const b=m?text.indexOf(SAVE_END,m.index):-1;
  if(!m||b<0) throw new Error('Das ist keine Zwischenstand-Datei. Bitte wähle die Datei „Zwischenstand zum Escape-Room '+SAVE_GAME_TITLE+' vom … von …“ aus.');
  if(m[1]&&+m[1]>SAVE_FORMAT) throw new Error(newer);
  const broken='Diese Zwischenstand-Datei wurde verändert oder ist beschädigt und kann nicht geladen werden.';
  let wrap;
  try{
    const bin=atob(text.slice(m.index+m[0].length,b).replace(/[^A-Za-z0-9+/=]/g,''));
    const bytes=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
    wrap=JSON.parse(new TextDecoder('utf-8',{fatal:true}).decode(saveScramble(bytes)));
  }catch(e){ throw new Error(broken); }
  if(!wrap||typeof wrap.d!=='string'||typeof wrap.id!=='string'||wrap.s!==saveHash(SAVE_SALT+'|'+wrap.id+'|'+wrap.d)) throw new Error(broken);
  let data; try{ data=JSON.parse(wrap.d); }catch(e){ throw new Error(broken); }
  if(wrap.id!==SAVE_ROOM_ID) throw new Error('Diese Zwischenstand-Datei gehört zu einem anderen Escape-Room'+(data&&data.game?' („'+data.game+'“)':'')+'. Bitte öffne den passenden Escape-Room.');
  if(wrap.f<SAVE_FORMAT) throw new Error('Diese Zwischenstand-Datei stammt aus einer älteren Fassung des Escape-Rooms (noch ohne Klasse) und kann nicht mehr geladen werden. Bitte beginne den Escape-Room neu und gib dabei deine Klasse an.');
  if(wrap.f>SAVE_FORMAT) throw new Error(newer);
  if(!data||typeof data!=='object'||!data.state||typeof data.state!=='object'||typeof data.screen!=='string') throw new Error(broken);
  return data;
}

function saveTwo(n){ return String(n).padStart(2,'0'); }
function saveFmtDate(d){ d=new Date(d); return saveTwo(d.getDate())+'.'+saveTwo(d.getMonth()+1)+'.'+d.getFullYear(); }
function saveFmtDateTime(d){ d=new Date(d); if(isNaN(d)) return '–'; return saveFmtDate(d)+' um '+saveTwo(d.getHours())+':'+saveTwo(d.getMinutes())+' Uhr'; }
function saveStudentName(){ return ((state.firstName||'')+' '+(state.lastName||'')).trim(); }
function saveFileName(d){
  const clean=s=>String(s||'').replace(/[\\/:*?"<>|\u0000-\u001F]+/g,' ').replace(/\s+/g,' ').trim();
  return clean('Zwischenstand zum Escape-Room '+SAVE_GAME_TITLE+' vom '+saveFmtDate(d)+' von '+(saveStudentName()||'Unbekannt'))+'.txt';
}

/* Toast-Meldung (unten, blendet sich selbst aus) */
let saveToastTimer=null;
// Die Meldefläche gibt es von Anfang an (leer): Eine Live-Region, die erst mit ihrem Text entsteht, liest kaum ein Screenreader vor.
function saveToastEl(){
  let t=document.getElementById('saveToast');
  if(!t){ t=document.createElement('div'); t.id='saveToast'; t.className='save-toast'; t.setAttribute('role','status'); document.body.appendChild(t); }
  return t;
}
function showSaveToast(msg,isError){
  const t=saveToastEl();
  t.setAttribute('role',isError?'alert':'status');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(saveToastTimer);
  saveToastTimer=setTimeout(()=>{ t.classList.remove('show'); saveToastTimer=setTimeout(()=>{ t.textContent=''; t.setAttribute('role','status'); },400); },6000);
}
saveToastEl();

/* ---------- Speichern ---------- */
window.saveProgress=()=>{
  try{
    const now=new Date();
    const target=saveResumeTarget(state.screen);
    const snap=JSON.parse(JSON.stringify(state));
    snap.screen=target;
    const data={ v:SAVE_FORMAT, game:SAVE_GAME_TITLE, savedAt:now.toISOString(), screen:target, place:saveScreenLabel(target), state:snap, extra:saveCollectExtra() };
    const name=saveStudentName()||'Unbekannt';
    const NL='\r\n';
    const text='\uFEFF'
      +'Zwischenstand zum Escape-Room „'+SAVE_GAME_TITLE+'“'+NL
      +'Name: '+name+NL
      +'Gespeichert am '+saveFmtDateTime(now)+' ('+data.place+')'+NL+NL
      +'So geht es weiter: Öffne den Escape-Room und klicke auf der Startseite ganz unten auf'+NL
      +'„Zwischenstand aus Datei laden und weiterspielen“. Lade dann diese Datei hoch.'+NL
      +'Bitte verändere diese Datei nicht – sonst kann sie nicht mehr geladen werden.'+NL+NL
      +SAVE_BEGIN+NL+saveEncode(data)+NL+SAVE_END+NL;
    const filename=saveFileName(now);
    // application/octet-stream: Der Browser speichert die Datei, statt sie nur anzuzeigen.
    const url=URL.createObjectURL(new Blob([text],{type:'application/octet-stream'}));
    const link=document.createElement('a');
    link.href=url; link.download=filename; link.style.display='none';
    document.body.appendChild(link); link.click();
    // Object-URL lange gültig lassen: iOS liest den Blob erst, wenn der Download-Dialog bestätigt ist.
    setTimeout(()=>{ try{ document.body.removeChild(link); }catch(_){} URL.revokeObjectURL(url); },60000);
    showSaveToast('Zwischenstand gespeichert. Du findest die Datei in deinem Download-Ordner.');
  }catch(e){ console.error(e); showSaveToast('Der Zwischenstand konnte nicht gespeichert werden. Bitte versuche es noch einmal.',true); }
};

/* ---------- Speicher-Button am Seitenende (bzw. im Platzhalter data-save-slot des Finales) ---------- */
function refreshSaveBar(){
  const box=document.getElementById(SAVE_CONTAINER_ID); if(!box) return;
  const bar=document.getElementById('saveBar');
  if(!saveScreenAllowed(state.screen)){ if(bar) bar.remove(); return; }
  const slot=box.querySelector('[data-save-slot]')||box;
  if(bar&&bar.parentNode===slot&&slot.lastElementChild===bar) return;
  if(bar) bar.remove();
  slot.insertAdjacentHTML('beforeend',
    '<div class="save-bar" id="saveBar"><button type="button" class="save-btn" onclick="saveProgress()" '
    +'title="Lädt eine Datei mit deinem bisherigen Fortschritt herunter. Damit kannst du später an dieser Stelle weiterspielen.">'
    +SAVE_ICON+'<span>Zwischenstand als Datei speichern</span></button></div>');
}
// Jede Bildschirm-Änderung ersetzt den Inhalt des Bildschirm-Containers – dann Button prüfen.

/* ---------- Laden ---------- */
function saveApplyState(snap){
  Object.keys(state).forEach(k=>{
    if(k==='screen'||!(k in snap)) return;
    const cur=state[k], val=snap[k];
    if(k==='completedAt'){ state[k]=val?new Date(val):null; return; }
    if(Array.isArray(cur)){ if(Array.isArray(val)) state[k]=val; return; }
    if(cur===null||val===null||typeof cur===typeof val) state[k]=val;
  });
  state.resumeLog=Array.isArray(state.resumeLog)?state.resumeLog.filter(e=>e&&typeof e==='object'&&typeof e.place==='string'):[];
}
// Inhalt einer Zwischenstand-Datei prüfen und vereinheitlichen, bevor er übernommen wird: dieselben Regeln wie beim Start
// (samt Klasse), genau so viele Räume wie ROOM_LABELS, Versuche als Ganzzahlen, Fehler als kurze Texte, Bildschirm passend
// zum Fortschritt. Sonst abgelehnt. (Die Prüfsumme steht im öffentlichen Code – ein Schutz gegen Beschädigung und Unsinn, kein Beweis.)
function saveCheckData(data){
  const broken='Diese Zwischenstand-Datei wurde verändert oder ist beschädigt und kann nicht geladen werden.';
  const bad=()=>{ throw new Error(broken); };
  const N=ROOM_LABELS.length;
  const sn=data.state, str=v=>typeof v==='string';
  const each=(a,f)=>{ if(!Array.isArray(a)||a.length!==N) bad(); return a.map(f); };
  const fn=cleanInput(sn.firstName), ln=cleanInput(sn.lastName), bd=str(sn.birthDate)?sn.birthDate:'', k=normKlasse(str(sn.klasse)?sn.klasse:'');
  const nameOk=x=>x.length>=2 && x.length<=40 && /\p{L}/u.test(x) && pdfPrintable(x);
  if(!nameOk(fn)||!nameOk(ln)) bad();
  const m=/^(\d{2})\.(\d{2})\.(\d{4})$/.exec(bd); if(!m) bad();
  const dt=new Date(+m[3],+m[2]-1,+m[1]);
  if(dt.getFullYear()!==+m[3]||dt.getMonth()!==+m[2]-1||dt.getDate()!==+m[1]||+m[3]<1950||dt>new Date()) bad();
  if(!/^[\p{L}\p{N}/-]{1,10}$/u.test(k)||!pdfPrintable(k)) bad();
  const solved=each(sn.solved,v=>{ if(typeof v!=='boolean') bad(); return v; });
  const attempts=each(sn.attempts,v=>{ if(!Number.isInteger(v)||v<0||v>999) bad(); return v; });
  const cut=v=>str(v)?cleanLine(v,2000):'';
  const mistakes=each(sn.mistakes,v=>{
    if(v===null) return null;
    if(!v||typeof v!=='object'||!Array.isArray(v.errors)||v.errors.length>200) bad();
    return { errors:v.errors.map(e=>{
      if(!e||typeof e!=='object'||!str(e.item)||!e.item.trim()) bad();
      const o={};   // Felder wie beim Speichern (kind, item, wrongAnswer, correctAnswer, explanation); fremde Felder entfallen
      if(str(e.kind)) o.kind=e.kind.slice(0,30);
      o.item=cut(e.item);
      if(str(e.wrongAnswer)) o.wrongAnswer=cut(e.wrongAnswer);
      if(str(e.correctAnswer)) o.correctAnswer=cut(e.correctAnswer);
      if(str(e.explanation)) o.explanation=cut(e.explanation);
      return o; }) };
  });
  // Räume nur der Reihe nach; gelöst heißt: mindestens ein Versuch
  const done=solved.filter(Boolean).length;
  solved.forEach((v,i)=>{ if(v!==(i<done) || (v && attempts[i]<1)) bad(); });
  let completedAt=null;
  if(sn.completedAt!=null){ if(!str(sn.completedAt)||isNaN(new Date(sn.completedAt))) bad(); completedAt=sn.completedAt; }
  // Bildschirm passend zum Fortschritt: Bibliotheks- bzw. Rätselraum k (auch die Textfassung von Bibliothek 2) erst nach k−1 gelösten Räumen
  const scr=data.screen, no=saveScreenNo(scr);
  const okScreen = scr==='final' ? done===N
    : no ? done===no-1
    : scr==='intro' ? done===0 : false;
  if(!okScreen) bad();
  const log=Array.isArray(sn.resumeLog)?sn.resumeLog.filter(e=>e&&typeof e==='object'&&str(e.place)).slice(-50)
    .map(e=>({ place:cleanLine(e.place,200), savedAt:str(e.savedAt)?e.savedAt:'', loadedAt:str(e.loadedAt)?e.loadedAt:'' })):[];
  return { screen:scr, state:{ firstName:fn, lastName:ln, birthDate:bd, klasse:k, code:computeCode(m[1]+m[2]+m[3]),
    solved, letters:solved.map((v,i)=>v?CODE_WORD[i]:'_'), mistakes, attempts, completedAt, resumeLog:log,
    pdfDownloaded:sn.pdfDownloaded===true } };
}
function saveLoadText(text){
  const data=saveDecode(text);
  const checked=saveCheckData(data);
  data.state=checked.state;
  saveApplyState(data.state);
  saveApplyExtra(data.extra||{},data);
  state.resumeLog.push({ place:String(data.place||saveScreenLabel(data.screen)), savedAt:String(data.savedAt||''), loadedAt:new Date().toISOString() });
  saveGoTo(data.screen);
  window.scrollTo({top:0,behavior:'instant'});
  showSaveToast('Willkommen zurück'+(state.firstName?', '+state.firstName:'')+'! Dein Zwischenstand vom '+saveFmtDateTime(data.savedAt)+' wurde geladen.');
}
function saveHandleFile(file){
  const err=document.getElementById('saveLoadError');
  const fail=msg=>{ if(err){ err.style.display='block'; err.textContent=msg; } };
  if(err) err.style.display='none';
  if(!file) return;
  // Eine PDF-Datei (z. B. die Überblick-PDF) gehört ins Feiditor-Feibeitsblatt, nicht hierher.
  file.slice(0,5).text().then(head=>{
    if(head==='%PDF-') fail(FB_CODE?'Das ist eine PDF-Datei. Deine Überblick-PDF lädst du im Feiditor-Feibeitsblatt hoch: feibeitsblatt.janrickmer.de → „Zwischenstand-PDF hochladen“.':'Das ist eine PDF-Datei. Hier brauchst du deine Zwischenstand-Datei (.txt) – sie liegt meistens in deinem Download-Ordner.');
    else saveReadFile(file,fail);
  },()=>saveReadFile(file,fail));
}
function saveReadFile(file,fail){
  if(file.size>2*1024*1024){ fail('Diese Datei ist zu groß für eine Zwischenstand-Datei.'); return; }
  const fr=new FileReader();
  fr.onload=()=>{ try{ saveLoadText(String(fr.result||'')); }catch(e){ console.warn(e); fail(e.message); } };
  fr.onerror=()=>fail('Die Datei konnte nicht gelesen werden. Bitte versuche es noch einmal.');
  fr.readAsText(file,'utf-8');
}
window.renderResume=()=>{
  state.screen='resume';
  saveRenderResumeScreen();   // Anpassung: zeichnet die Upload-Seite (IDs saveDrop, saveFileInput, saveLoadError)
  const input=document.getElementById('saveFileInput'), drop=document.getElementById('saveDrop');
  input.addEventListener('change',()=>{ saveHandleFile(input.files&&input.files[0]); input.value=''; });
  ['dragenter','dragover'].forEach(ev=>drop.addEventListener(ev,()=>drop.classList.add('drag')));
  drop.addEventListener('dragleave',()=>drop.classList.remove('drag'));
};
// Dateien, die irgendwo auf der Upload-Seite abgelegt werden, laden (statt sie im Browser zu öffnen).
document.addEventListener('dragover',e=>{ if(state.screen==='resume') e.preventDefault(); });
document.addEventListener('drop',e=>{
  if(state.screen!=='resume') return;
  e.preventDefault();
  const drop=document.getElementById('saveDrop'); if(drop) drop.classList.remove('drag');
  saveHandleFile(e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files[0]);
});
function saveDropHtml(){
  return '<label class="save-drop" id="saveDrop">'+LOAD_ICON
    +'<span><strong>Zwischenstand-Datei auswählen</strong><br>oder hierher ziehen</span>'
    +'<input type="file" id="saveFileInput" accept=".txt,text/plain"></label>'
    +'<div id="saveLoadError" class="input-error" role="alert"></div>';
}

/* ---------- Vermerk für die Überblick-PDF ---------- */
function saveLogPdfLines(){
  const log=Array.isArray(state.resumeLog)?state.resumeLog:[];
  if(!log.length) return ['Es wurde keine Zwischenstand-Datei geladen.'];
  const lines=[log.length===1?'Es wurde 1-mal eine Zwischenstand-Datei geladen:':'Es wurde '+log.length+'-mal eine Zwischenstand-Datei geladen:'];
  log.forEach((e,i)=>lines.push((i+1)+'. Weitergespielt ab '+e.place+' (Datei gespeichert am '+saveFmtDateTime(e.savedAt)+', geladen am '+saveFmtDateTime(e.loadedAt)+').'));
  return lines;
