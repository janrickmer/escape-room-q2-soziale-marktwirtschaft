<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Stunde Null · Die Ordnung des Wiederaufbaus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700&family=Inter:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
/* ============================================================
   STUNDE NULL — Escape Room
   Politik & Wirtschaft · Q-Phase Grundkurs · Soziale Marktwirtschaft
   Helles, seriös-wirtschaftliches Design
   ============================================================ */

:root{
  --bg:           #f4f1ea;
  --bg-soft:      #efeae0;
  --surface:      #ffffff;
  --surface-alt:  #faf8f3;
  --ink:          #1d2733;
  --ink-soft:     #43505f;
  --ink-mute:     #6c7888;
  --primary:      #1f4e5f;   /* tiefes Petrol */
  --primary-dark: #163a47;
  --primary-soft: #e6eef0;
  --accent:       #a9772a;   /* gedämpftes Ocker/Gold */
  --accent-bright:#c08f3e;
  --accent-soft:  #f3ebda;
  --success:      #2f7d41;
  --success-bg:   #e9f3ea;
  --error:        #b1442f;
  --error-bg:     #f8eae6;
  --missed:       #a9772a;
  --missed-bg:    #f6efdf;
  --border:       rgba(29,39,51,0.12);
  --border-soft:  rgba(29,39,51,0.07);
  --shadow-sm:    0 1px 3px rgba(29,39,51,0.07), 0 1px 2px rgba(29,39,51,0.05);
  --shadow-md:    0 6px 24px rgba(29,39,51,0.10), 0 2px 6px rgba(29,39,51,0.06);
  --font-display: 'Fraunces', Georgia, 'Times New Roman', serif;
  --font-body:    'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --font-mono:    'IBM Plex Mono', 'Menlo', 'Courier New', monospace;
}

*{ box-sizing:border-box; margin:0; padding:0; }

html,body{
  background:var(--bg);
  color:var(--ink);
  font-family:var(--font-body);
  font-weight:400;
  line-height:1.65;
  min-height:100vh;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
}
body::before{
  content:'';
  position:fixed; inset:0; z-index:-2;
  background:
    radial-gradient(ellipse at 12% 8%, rgba(31,78,95,0.06) 0%, transparent 45%),
    radial-gradient(ellipse at 90% 92%, rgba(169,119,42,0.06) 0%, transparent 45%),
    linear-gradient(180deg, var(--bg) 0%, var(--bg-soft) 100%);
  pointer-events:none;
}

.app{ min-height:100vh; display:flex; flex-direction:column; }

/* ---------- Topbar ---------- */
.topbar{
  position:sticky; top:0; z-index:50;
  background:rgba(255,255,255,0.88);
  backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border-soft);
  padding:12px 26px;
  display:flex; align-items:center; justify-content:space-between; gap:20px;
}
.topbar-brand{
  display:flex; align-items:center; gap:11px;
  font-family:var(--font-display); font-weight:600; font-size:15px;
  color:var(--primary); letter-spacing:0.01em;
}
.topbar-brand svg{ width:24px; height:24px; stroke:var(--primary); fill:none; }
.topbar-progress{ display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
.seal{
  width:30px; height:30px; border-radius:50%;
  border:1.5px solid var(--border); background:var(--surface);
  display:flex; align-items:center; justify-content:center;
  font-family:var(--font-mono); font-size:11px; font-weight:600;
  color:var(--ink-mute); transition:all .35s cubic-bezier(.4,0,.2,1);
}
.seal.library{
  width:11px; height:11px; border-radius:2px; border:1.5px solid var(--border);
  background:transparent;
}
.seal.library.active{ border-color:var(--primary); background:var(--primary); }
.seal.library.visited{ border-color:var(--accent); background:var(--accent); }
.seal.active{ border-color:var(--primary); color:var(--primary); box-shadow:0 0 0 3px var(--primary-soft); }
.seal.solved{
  background:var(--accent); border-color:var(--accent); color:#fff;
  font-family:var(--font-display); font-weight:700; font-size:14px; transform:rotate(-3deg);
}

/* ---------- Layout ---------- */
.main{ flex:1; display:flex; align-items:flex-start; justify-content:center; padding:52px 22px 64px; }
.screen{ width:100%; max-width:880px; animation:screenIn .55s cubic-bezier(.16,1,.3,1) both; }
@keyframes screenIn{ from{opacity:0; transform:translateY(18px);} to{opacity:1; transform:translateY(0);} }

.site-footer{
  text-align:center; font-size:11px; color:var(--ink-mute);
  padding:18px 12px 22px; border-top:1px solid var(--border-soft);
  font-family:var(--font-mono); letter-spacing:0.02em;
}

/* ---------- Typography ---------- */
h1,h2,h3{ font-family:var(--font-display); font-weight:600; line-height:1.15; color:var(--ink); letter-spacing:-0.01em; }
.kicker{
  font-family:var(--font-mono); font-size:11px; font-weight:600; letter-spacing:0.18em;
  text-transform:uppercase; color:var(--accent); margin-bottom:14px;
  display:flex; align-items:center; gap:11px;
}
.kicker::before{ content:''; width:26px; height:1px; background:var(--accent); display:inline-block; }
.title-mega{ font-size:clamp(40px,7vw,68px); font-weight:600; line-height:1; margin-bottom:20px; letter-spacing:-0.025em; }
.title-mega em{ font-style:italic; font-weight:400; color:var(--primary); }
.lede{ font-family:var(--font-display); font-size:clamp(17px,2vw,21px); font-weight:400; line-height:1.5; color:var(--ink-soft); max-width:60ch; margin-bottom:28px; }
.section-title{ font-size:clamp(28px,4vw,40px); font-weight:600; margin-bottom:8px; }
p{ margin-bottom:14px; }
p.body-lg{ font-size:16.5px; line-height:1.7; }
.text-mute{ color:var(--ink-mute); }

/* ---------- Cards ---------- */
.card{
  background:var(--surface); border:1px solid var(--border-soft);
  border-radius:8px; padding:30px 34px; margin-bottom:22px; box-shadow:var(--shadow-sm); position:relative;
}
.card-accent::before{
  content:''; position:absolute; left:0; top:22px; bottom:22px; width:3px;
  background:var(--accent); border-radius:0 2px 2px 0;
}
.briefing{ font-family:var(--font-display); font-style:italic; font-size:17px; line-height:1.7; color:var(--ink); padding-left:18px; }
.briefing .speaker{
  display:block; font-family:var(--font-mono); font-style:normal; font-size:10px; font-weight:600;
  letter-spacing:0.18em; text-transform:uppercase; color:var(--accent); margin-bottom:8px;
}

/* ---------- Buttons ---------- */
.btn{
  display:inline-flex; align-items:center; gap:9px; padding:13px 26px; border:none; border-radius:4px;
  font-family:var(--font-body); font-size:13.5px; font-weight:600; letter-spacing:0.02em;
  cursor:pointer; transition:all .22s cubic-bezier(.4,0,.2,1); text-decoration:none;
}
.btn-primary{ background:var(--primary); color:#fff; }
.btn-primary:hover{ background:var(--primary-dark); transform:translateY(-1px); box-shadow:var(--shadow-md); }
.btn-ghost{ background:transparent; color:var(--primary); border:1.5px solid var(--border); }
.btn-ghost:hover{ border-color:var(--primary); }
.btn-arrow::after{ content:'\2192'; font-family:var(--font-mono); font-size:15px; }
.btn-row{ display:flex; gap:14px; flex-wrap:wrap; margin-top:22px; align-items:center; }

/* ---------- Inputs ---------- */
.field-label{ display:block; font-family:var(--font-mono); font-size:10px; font-weight:600; letter-spacing:0.16em; text-transform:uppercase; color:var(--accent); margin-bottom:6px; }
.text-input{
  width:100%; padding:12px 14px; background:var(--surface-alt); border:1.5px solid var(--border);
  border-radius:4px; color:var(--ink); font-family:var(--font-body); font-size:15px;
}
.text-input:focus{ outline:none; border-color:var(--primary); background:#fff; }
.input-error{ display:none; margin-top:14px; padding:10px 14px; background:var(--error-bg); border-left:3px solid var(--error); color:var(--ink); font-size:13px; border-radius:4px; }

/* ---------- Room header ---------- */
.room-header{ display:flex; align-items:flex-start; gap:18px; margin-bottom:18px; }
.room-number{ font-family:var(--font-display); font-size:46px; font-weight:600; color:var(--accent); line-height:0.9; }
.room-location{ font-family:var(--font-mono); font-size:11px; letter-spacing:0.14em; text-transform:uppercase; color:var(--ink-mute); }
.room-name{ font-family:var(--font-display); font-size:26px; font-weight:600; color:var(--ink); }

/* ---------- Library ---------- */
.library-banner{
  display:flex; gap:14px; align-items:flex-start; background:var(--primary-soft);
  border:1px solid rgba(31,78,95,0.18); border-radius:8px; padding:16px 18px; margin-bottom:26px;
}
.library-banner svg{ width:22px; height:22px; stroke:var(--primary); fill:none; flex-shrink:0; margin-top:2px; }
.library-banner .warn{ display:block; margin-top:6px; color:var(--primary-dark); font-weight:600; font-size:13.5px; }
.lib-section{ margin-bottom:22px; }
.lib-section-title{ font-family:var(--font-display); font-size:19px; font-weight:600; color:var(--primary); margin-bottom:8px; }
.lib-bullets{ margin:8px 0 0 20px; }
.lib-bullets li{ margin-bottom:7px; }
.lib-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:12px; margin-top:12px; }
@media(max-width:600px){ .lib-grid{ grid-template-columns:1fr; } }
.lib-card{ background:var(--surface-alt); border:1px solid var(--border-soft); border-radius:6px; padding:14px 16px; }
.lib-card-sub{ font-family:var(--font-mono); font-size:9.5px; letter-spacing:0.12em; text-transform:uppercase; color:var(--accent); }
.lib-card-title{ font-family:var(--font-display); font-size:16px; font-weight:600; margin:2px 0 5px; }
.lib-card-body{ font-size:13.5px; color:var(--ink-soft); }
.lib-table{ width:100%; border-collapse:collapse; margin-top:10px; font-size:14px; }
.lib-table th,.lib-table td{ text-align:left; padding:9px 11px; border-bottom:1px solid var(--border-soft); }
.lib-table th{ font-family:var(--font-mono); font-size:10px; letter-spacing:0.1em; text-transform:uppercase; color:var(--ink-mute); }
.lib-warning-bar{
  display:flex; gap:12px; align-items:center; background:var(--accent-soft);
  border:1px solid rgba(169,119,42,0.3); border-radius:8px; padding:14px 18px; margin:22px 0;
}
.lib-warning-bar svg{ width:22px; height:22px; stroke:var(--accent); fill:none; flex-shrink:0; }

/* ---------- Video ---------- */
.video-wrap{ position:relative; width:100%; padding-top:56.25%; border-radius:8px; overflow:hidden; box-shadow:var(--shadow-md); background:#000; margin:8px 0 8px; }
.video-wrap iframe{ position:absolute; inset:0; width:100%; height:100%; border:0; }
.fallback-line{ display:flex; gap:14px; flex-wrap:wrap; align-items:center; margin-top:14px; font-size:14px; color:var(--ink-soft); }

/* ---------- Puzzle: single choice ---------- */
.mc-question{ margin-bottom:24px; }
.mc-q-text{ font-weight:600; font-size:16px; margin-bottom:12px; }
.mc-option{
  display:flex; align-items:flex-start; gap:11px; width:100%; text-align:left;
  padding:13px 16px; margin-bottom:9px; background:var(--surface); border:1.5px solid var(--border);
  border-radius:6px; cursor:pointer; font-size:14.5px; line-height:1.5; transition:all .18s ease; font-family:var(--font-body); color:var(--ink);
}
.mc-option:hover{ border-color:var(--primary); }
.mc-option .dot{ width:18px; height:18px; border-radius:50%; border:2px solid var(--border); flex-shrink:0; margin-top:1px; }
.mc-option.selected{ border-color:var(--primary); background:var(--primary-soft); }
.mc-option.selected .dot{ border-color:var(--primary); background:var(--primary); box-shadow:inset 0 0 0 3px var(--surface); }
.mc-option.correct{ border-color:var(--success); background:var(--success-bg); }
.mc-option.incorrect{ border-color:var(--error); background:var(--error-bg); }

/* ---------- Puzzle: lückentext + matching dropdowns ---------- */
.cloze{ font-size:16px; line-height:2.2; }
.cloze select, .match-select{
  font-family:var(--font-body); font-size:14px; font-weight:600; color:var(--primary);
  background:var(--accent-soft); border:1.5px solid var(--accent); border-radius:5px; padding:4px 8px; margin:0 2px;
}
.cloze select.ok, .match-select.ok{ border-color:var(--success); background:var(--success-bg); color:var(--success); }
.cloze select.bad, .match-select.bad{ border-color:var(--error); background:var(--error-bg); color:var(--error); }
.match-row{ display:flex; align-items:center; gap:14px; padding:12px 0; border-bottom:1px solid var(--border-soft); flex-wrap:wrap; }
.match-left{ flex:1; min-width:200px; font-weight:600; font-size:15px; }
.match-left .lc-sub{ display:block; font-weight:400; font-size:13px; color:var(--ink-mute); }

/* ---------- Puzzle: multi-select grid ---------- */
.multi-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:11px; margin:20px 0; }
@media(max-width:600px){ .multi-grid{ grid-template-columns:1fr; } }
.multi-card{
  display:flex; align-items:flex-start; gap:11px; padding:15px 16px; background:var(--surface);
  border:1.5px solid var(--border); border-radius:6px; cursor:pointer; font-size:14px; line-height:1.45;
  text-align:left; transition:all .18s ease; font-family:var(--font-body); color:var(--ink);
}
.multi-card:hover{ border-color:var(--primary); }
.multi-card .box{ width:18px; height:18px; border-radius:4px; border:2px solid var(--border); flex-shrink:0; margin-top:1px; }
.multi-card.selected{ border-color:var(--primary); background:var(--primary-soft); }
.multi-card.selected .box{ border-color:var(--primary); background:var(--primary); }
.multi-card.correct{ border-color:var(--success); background:var(--success-bg); }
.multi-card.incorrect{ border-color:var(--error); background:var(--error-bg); }
.multi-card.missed{ border-color:var(--missed); background:var(--missed-bg); }

/* ---------- Puzzle: classify rows ---------- */
.classify-row{ display:flex; align-items:center; gap:12px; padding:12px 0; border-bottom:1px solid var(--border-soft); flex-wrap:wrap; }
.classify-text{ flex:1; min-width:210px; font-size:14.5px; }
.classify-btns{ display:flex; gap:8px; }
.classify-btn{
  font-family:var(--font-body); font-size:12.5px; font-weight:600; padding:8px 14px; border-radius:5px;
  border:1.5px solid var(--border); background:var(--surface); color:var(--ink-soft); cursor:pointer; transition:all .18s ease;
}
.classify-btn:hover{ border-color:var(--primary); }
.classify-btn.active{ border-color:var(--primary); background:var(--primary); color:#fff; }
.classify-row.correct{ background:var(--success-bg); }
.classify-row.incorrect{ background:var(--error-bg); }

/* ---------- Status / hint ---------- */
.status{ padding:14px 18px; border-radius:6px; margin:18px 0; font-size:14px; display:none; }
.status.show{ display:block; animation:screenIn .3s ease both; }
.status .label{ display:block; font-family:var(--font-mono); font-size:10px; font-weight:600; letter-spacing:0.14em; text-transform:uppercase; margin-bottom:4px; }
.status-success{ background:var(--success-bg); border-left:3px solid var(--success); }
.status-success .label{ color:var(--success); }
.status-warning{ background:var(--error-bg); border-left:3px solid var(--error); }
.status-warning .label{ color:var(--error); }
.hint-box{ display:none; background:var(--surface-alt); border:1px dashed var(--border); border-radius:6px; padding:14px 18px; margin-top:16px; font-size:14px; color:var(--ink-soft); }
.hint-box.show{ display:block; }
.hint-box .label{ display:block; font-family:var(--font-mono); font-size:10px; font-weight:600; letter-spacing:0.14em; text-transform:uppercase; color:var(--accent); margin-bottom:5px; }
.hint-btn{ background:none; border:none; color:var(--primary); font-family:var(--font-body); font-size:13px; font-weight:600; cursor:pointer; text-decoration:underline; }

/* ---------- Reveal overlay ---------- */
.reveal-overlay{ position:fixed; inset:0; z-index:200; background:rgba(22,58,71,0.55); backdrop-filter:blur(4px); display:none; align-items:center; justify-content:center; padding:20px; }
.reveal-overlay.show{ display:flex; animation:screenIn .3s ease both; }
.reveal-card{ background:var(--surface); border-radius:12px; box-shadow:var(--shadow-md); padding:40px 44px; max-width:440px; text-align:center; }
.reveal-letter{ font-family:var(--font-display); font-size:96px; font-weight:700; color:var(--accent); line-height:1; }
.reveal-caption{ font-family:var(--font-mono); font-size:11px; letter-spacing:0.16em; text-transform:uppercase; color:var(--ink-mute); margin-top:6px; }
.reveal-progress{ display:flex; gap:8px; justify-content:center; margin:22px 0 26px; }
.reveal-progress-letter{ width:38px; height:46px; display:flex; align-items:center; justify-content:center; font-family:var(--font-display); font-size:22px; font-weight:700; color:var(--ink-mute); background:var(--surface-alt); border:1px solid var(--border); border-radius:5px; }
.reveal-progress-letter.lit{ color:#fff; background:var(--accent); border-color:var(--accent); }

/* ---------- Final ---------- */
/* ---------- Zwischenstand-Seite (nach dem letzten Rätselraum, vor dem Finale) ---------- */
.mid-hero{ text-align:center; margin-bottom:18px; }
.mid-hero .section-title{ font-size:clamp(26px,3.6vw,34px); margin-bottom:2px; }
.mid-steps{ display:flex; justify-content:center; align-items:center; gap:10px; flex-wrap:wrap; margin:12px 0 0; }
.mid-step{ display:inline-flex; align-items:center; gap:8px; padding:8px 14px; border-radius:999px; border:1.5px solid var(--border); background:var(--surface); font-family:var(--font-mono); font-size:11px; letter-spacing:.12em; text-transform:uppercase; font-weight:600; color:var(--ink-mute); }
.mid-step.done{ border-color:var(--success); background:var(--success-bg); color:var(--success); }
.mid-step.next{ border-color:var(--primary); background:var(--primary-soft); color:var(--primary-dark); }
.code-badge{ display:inline-flex; align-items:baseline; gap:10px; padding:5px 14px; border-radius:8px; background:var(--surface); border:1.5px solid var(--border); box-shadow:var(--shadow-sm); font-family:var(--font-display); font-size:20px; font-weight:700; letter-spacing:.14em; color:var(--accent); }
.code-badge small{ font-family:var(--font-mono); font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-mute); font-weight:600; }
.pause-card{ margin-top:18px; padding:20px 22px; border:1.5px dashed var(--border); border-radius:8px; background:var(--surface-alt); }
.pause-btn{ display:inline-flex; align-items:center; gap:10px; background:var(--surface); color:var(--primary-dark); border:1.5px solid var(--primary); border-radius:8px; padding:13px 20px; font-family:var(--font-body); font-size:15px; font-weight:600; text-align:left; cursor:pointer; transition:all .2s ease; }
.pause-btn:hover{ background:var(--primary-soft); transform:translateY(-1px); }
.pause-btn svg{ width:20px; height:20px; flex:none; }
.readmore{ display:flex; align-items:center; gap:14px; margin:40px 0 16px; font-family:var(--font-mono); font-size:11px; letter-spacing:.14em; text-transform:uppercase; font-weight:600; color:var(--ink-mute); }
.readmore::before, .readmore::after{ content:''; flex:1; height:1px; background:var(--border); }
.final-actions{ display:grid; gap:14px; }
.final-action{ display:block; width:100%; text-align:left; background:var(--surface-alt); border:1.5px solid var(--border); border-radius:8px; padding:18px 20px; cursor:pointer; transition:all .2s ease; font-family:var(--font-body); }
.final-action:hover{ border-color:var(--primary); box-shadow:var(--shadow-sm); }
.final-action .label{ font-family:var(--font-mono); font-size:10px; letter-spacing:0.14em; text-transform:uppercase; color:var(--accent); font-weight:600; }
.final-action .title{ font-family:var(--font-display); font-size:18px; font-weight:600; color:var(--ink); margin:3px 0 4px; }
.final-action .desc{ font-size:13.5px; color:var(--ink-soft); }
.font-mono{ font-family:var(--font-mono); }
.muted-list{ margin:6px 0 0 18px; }
.muted-list li{ margin-bottom:6px; color:var(--ink-soft); font-size:14px; }

/* Erhard portrait card */
.erhard-card{ display:flex; gap:22px; align-items:flex-start; flex-wrap:wrap; background:var(--surface-alt); border:1px solid var(--border-soft); border-radius:10px; padding:22px 24px; }
.erhard-frame{ width:128px; flex-shrink:0; }
.erhard-frame svg{ width:128px; height:160px; display:block; }
.erhard-cap{ text-align:center; font-family:var(--font-mono); font-size:9px; letter-spacing:0.06em; color:var(--ink-mute); margin-top:6px; }
.erhard-body{ flex:1; min-width:240px; }
.erhard-body h3{ font-size:20px; margin-bottom:2px; }
.erhard-dates{ font-family:var(--font-mono); font-size:11px; letter-spacing:0.1em; color:var(--accent); margin-bottom:10px; }

/* House SVG */
.house-wrap{ text-align:center; margin:10px 0 4px; }
.house-wrap svg{ max-width:440px; width:100%; height:auto; }
.house-wrap.small svg{ max-width:170px; }

/* ---- Arena: das große Finale gegen den Feiditor (bewusst dunkel, dramatisch, unabhängig vom Farbschema) ---- */
.arena{ background:radial-gradient(120% 90% at 50% 0%, #17223a 0%, #0b1220 55%, #070c16 100%); color:#e9eef7; border-radius:14px; padding:26px 28px 26px; margin-top:22px; box-shadow:0 18px 50px rgba(0,0,0,.45); border:1px solid rgba(255,255,255,.06); }
.arena-kicker{ font-family:var(--font-mono); font-size:11px; letter-spacing:.28em; text-transform:uppercase; color:#d6b25e; font-weight:600; text-align:center; }
.arena h2{ font-family:var(--font-display); font-size:26px; font-weight:700; color:#fff; text-align:center; margin:6px 0 14px; letter-spacing:.01em; }
.arena .video-wrap{ max-width:760px; margin:0 auto; }
/* YouTube-Ausweichlink direkt unter dem Video: hell auf dunklem Grund */
.arena .fallback-line{ justify-content:center; max-width:760px; margin:12px auto 18px; color:#b9c4d8; }
.arena .fallback-line .btn-ghost{ color:#f0cf78; border-color:rgba(240,207,120,.5); }
.arena .fallback-line .btn-ghost:hover{ color:#1a1305; background:#f0cf78; border-color:#f0cf78; }
.arena p{ max-width:620px; margin:0 auto 22px; text-align:center; font-size:15px; line-height:1.6; color:#b9c4d8; }
.arena-gate{ display:block; width:100%; max-width:760px; margin:0 auto; padding:0; border:0; background:transparent; cursor:pointer; position:relative; border-radius:12px; overflow:hidden; outline:none; }
.arena-gate svg{ display:block; width:100%; height:auto; }
.arena-gate .gate-glow{ opacity:0; transition:opacity .4s ease; }
.arena-gate:hover .gate-glow, .arena-gate:focus-visible .gate-glow{ opacity:1; }
.arena-gate .gate-field{ transition:filter .3s ease; }
.arena-gate:hover .gate-field{ filter:brightness(1.2); }
.arena-gate:focus-visible{ box-shadow:0 0 0 3px #d6b25e; }
/* Button im Gang: sitzt unten über dem Bild, der ganze Gang ist klickbar */
.arena-enter{ position:absolute; left:50%; bottom:22px; transform:translateX(-50%); display:inline-flex; align-items:center; gap:10px; background:linear-gradient(135deg,#f0cf78,#d6b25e); color:#1a1305; font-family:var(--font-body); font-size:15.5px; font-weight:700; padding:14px 26px; border-radius:999px; box-shadow:0 8px 24px rgba(0,0,0,.55); white-space:nowrap; pointer-events:none; transition:transform .2s ease, box-shadow .2s ease; }
.arena-gate:hover .arena-enter, .arena-gate:focus-visible .arena-enter{ transform:translateX(-50%) translateY(-3px); box-shadow:0 12px 30px rgba(0,0,0,.6); }
.arena-foot{ text-align:center; font-size:12.5px; color:#7f8cab; margin-top:16px; }
@media (max-width:600px){ .arena{ padding:26px 16px 22px; } .arena h2{ font-size:24px; } .arena-enter{ white-space:normal; text-align:center; max-width:92%; font-size:13px; line-height:1.25; padding:10px 16px; bottom:12px; gap:6px; } }

/* ---------- Zwischenstand speichern / laden ---------- */
.save-bar{ display:flex; justify-content:flex-start; margin-top:44px; padding-top:18px; border-top:1px dashed var(--border); }
.save-btn{ display:inline-flex; align-items:center; gap:9px; padding:11px 18px; background:var(--surface); color:var(--ink-soft); border:1.5px solid var(--border); border-radius:4px; font-family:var(--font-body); font-size:13.5px; font-weight:600; letter-spacing:0.02em; cursor:pointer; transition:all .22s cubic-bezier(.4,0,.2,1); }
.save-btn:hover{ border-color:var(--primary); color:var(--primary); box-shadow:var(--shadow-sm); }
.save-btn svg{ width:18px; height:18px; flex:none; }
.save-load-field{ display:flex; align-items:center; gap:14px; width:100%; max-width:640px; margin-top:30px; padding:16px 20px; background:var(--surface-alt); border:1.5px dashed var(--border); border-radius:8px; color:var(--ink); font-family:var(--font-body); font-size:15px; font-weight:600; text-align:left; cursor:pointer; transition:all .22s cubic-bezier(.4,0,.2,1); }
.save-load-field:hover{ border-color:var(--primary); color:var(--primary-dark); background:var(--surface); }
.save-load-field svg{ width:22px; height:22px; flex:none; color:var(--accent); }
.save-drop{ display:flex; flex-direction:column; align-items:center; gap:10px; padding:28px 18px; border:1.5px dashed var(--border); border-radius:8px; background:var(--surface-alt); color:var(--ink-soft); text-align:center; font-size:14.5px; line-height:1.5; cursor:pointer; transition:all .2s ease; }
.save-drop:hover, .save-drop.drag, .save-drop:focus-within{ border-color:var(--primary); background:var(--primary-soft); }
.save-drop svg{ width:30px; height:30px; color:var(--primary); }
.save-drop strong{ color:var(--primary-dark); }
.save-drop input{ position:absolute; width:1px; height:1px; opacity:0; pointer-events:none; }
.save-toast{ position:fixed; left:50%; bottom:22px; z-index:2000; max-width:calc(100vw - 32px); width:max-content; padding:12px 18px; background:var(--primary-dark); color:#fff; border-radius:6px; box-shadow:var(--shadow-md); font-family:var(--font-body); font-size:14px; font-weight:500; line-height:1.45; opacity:0; transform:translate(-50%,16px); transition:opacity .25s ease, transform .25s ease; pointer-events:none; }
.save-toast.show{ opacity:1; transform:translate(-50%,0); }
</style>
</head>
<body>
<!-- ==== Eingebetteter Feiditor (Digitales Arbeitsblatt) ==== -->
<script type="text/template" id="feiditor-src">
<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Feiditor</title>
<style>
  :root{
    --paper:#f7f4ec; --paper2:#fffdf8; --ink:#221f1a; --muted:#6f675a;
    --line:#ddd5c4; --accent:#6b4f2c; --accent2:#8a6a3c; --shadow:rgba(40,30,15,.10);
    --serif:"Iowan Old Style","Palatino Linotype","Book Antiqua",Palatino,Georgia,serif;
    --sans:"Avenir Next",Avenir,"Segoe UI","Helvetica Neue",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--paper); color:var(--ink); font-family:var(--sans);
    -webkit-font-smoothing:antialiased; line-height:1.5;
  }
  .screen{display:none; min-height:100vh}
  .screen.active{display:block}

  /* ---------- Start ---------- */
  #screen-start{display:none; padding:0}
  #screen-start.active{display:block}
  .start-wrap{max-width:680px; margin:0 auto; padding:48px 20px 90px}
  .card{
    width:100%; max-width:440px; margin:0 auto; background:var(--paper2);
    border:1px solid var(--line); border-radius:14px; padding:40px 36px;
    box-shadow:0 18px 50px -28px var(--shadow);
  }
  .brand{font-family:var(--serif); font-size:13px; letter-spacing:.22em; text-transform:uppercase; color:var(--accent); margin:0 0 6px}
  .card h1{font-family:var(--serif); font-weight:600; font-size:30px; margin:0 0 4px; letter-spacing:.01em}
  .card p.sub{color:var(--muted); margin:0 0 26px; font-size:14.5px}
  label{display:block; font-size:12.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); margin:0 0 6px}
  .field{margin-bottom:18px}
  input[type=text]{
    width:100%; font-family:var(--serif); font-size:18px; color:var(--ink);
    background:var(--paper); border:1px solid var(--line); border-radius:9px;
    padding:11px 13px; outline:none; transition:border-color .15s, box-shadow .15s;
  }
  input[type=text]:focus{border-color:var(--accent2); box-shadow:0 0 0 3px rgba(138,106,60,.16)}
  .btn{
    font-family:var(--sans); font-size:15px; font-weight:600; letter-spacing:.01em;
    color:var(--paper2); background:var(--ink); border:1px solid var(--ink);
    border-radius:9px; padding:12px 18px; cursor:pointer; transition:transform .06s, background .15s;
  }
  .btn:hover{background:#332e25}
  .btn:active{transform:translateY(1px)}
  .btn.block{width:100%; margin-top:6px}
  .btn.ghost{background:transparent; color:var(--ink); border-color:var(--line)}
  .btn.ghost:hover{background:var(--paper)}
  .err{color:#b3261e; font-size:13.5px; min-height:18px; margin:2px 0 0}
  /* Startseite: Auswahl, was zutrifft (normal / Escape-Room / Zwischenstand) */
  .choice-btn{white-space:normal; text-align:left; line-height:1.35; padding:13px 16px; margin-top:10px}
  .choice-btn:first-of-type{margin-top:0}
  #choice .sub{margin-bottom:16px}
  .card .backlink{margin:18px 0 0}
  /* Infokasten unter der Anmeldekarte (optional, z. B. Lerntagebuch-Feiditor) */
  .infobox{
    margin:28px auto 0; max-width:680px; background:#f4ecd9;
    border:1px solid #e4d8bd; border-left:4px solid var(--accent); border-radius:12px;
    padding:24px 28px; color:#3f372b; font-size:14px; line-height:1.62;
  }
  .ib-title{font-family:var(--serif); font-size:21px; color:var(--accent); margin:0 0 12px; font-weight:600}
  .infobox p{margin:0 0 12px}
  .ib-sub{font-family:var(--sans); font-size:13.5px; letter-spacing:.02em; color:var(--ink); margin:18px 0 8px; font-weight:700}
  .infobox ul{margin:0 0 12px; padding-left:20px}
  .infobox li{margin:0 0 5px}
  .infobox li:last-child{margin-bottom:0}

  /* ---------- Editor ---------- */
  #screen-editor{display:none; flex-direction:column; height:100vh}
  #screen-editor.active{display:flex}
  .topbar{
    display:flex; align-items:center; justify-content:space-between; gap:16px;
    padding:13px 22px; border-bottom:1px solid var(--line); background:var(--paper2);
  }
  .who{font-family:var(--serif); font-size:16px}
  .who .lbl{font-family:var(--sans); font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--muted); margin-right:8px}
  .count{font-size:12.5px; color:var(--muted); font-variant-numeric:tabular-nums}
  .topbar .right{display:flex; align-items:center; gap:14px; flex-wrap:wrap; justify-content:flex-end}
  .btn.small{font-size:13px; padding:8px 12px; border-radius:8px}
  .paperwrap{flex:1; overflow:auto; display:flex; flex-direction:column; align-items:center; padding:34px 20px 170px}
  /* Roter Hinweis über dem Texteditor (nur ohne vorbefüllte Aufgaben) */
  .taskhint{
    width:100%; max-width:760px; margin:0 0 14px; color:#b3261e; font-family:var(--sans);
    font-size:14.5px; font-weight:700; line-height:1.45; text-align:center;
  }
  .sheet{
    position:relative; width:100%; max-width:760px; background:var(--paper2); border:1px solid var(--line);
    border-radius:6px; box-shadow:0 24px 60px -40px var(--shadow); padding:56px 60px 110px;
  }
  #editor{
    width:100%; min-height:60vh; border:0; outline:0; background:transparent;
    font-family:var(--serif); font-size:18.5px; line-height:1.78; color:var(--ink);
    white-space:pre-wrap; word-wrap:break-word; overflow-wrap:anywhere;
  }
  #editor:focus{outline:0}
  #editor .heading{font-weight:700; font-size:2em; line-height:1.25; margin:.1em 0}
  #editor.empty::before{content:attr(data-placeholder); color:#b9b0a0; pointer-events:none}

  /* Aufgabenblöcke: fest (nicht editierbar), fett; ein Klick zeigt das rote „x" zum Entfernen.
     Der obere Abstand lässt Platz für den Button „Neuen Aufgabentext eintragen" unter der Antwortzeile davor. */
  #editor .task{
    position:relative; font-weight:700; margin:44px 0 6px; padding:2px 34px 2px 0;
    border-radius:4px; cursor:default;
  }
  #editor .task:first-child{margin-top:0}
  #editor .task.selected{background:#fdecea; box-shadow:0 0 0 1px #f5b8b1}
  #editor .task .task-label{
    display:inline-block; font-family:var(--sans); font-size:12px; font-weight:700;
    letter-spacing:.14em; text-transform:uppercase; color:var(--muted); margin-bottom:2px;
  }
  #editor .task .task-x{
    display:none; position:absolute; right:4px; top:4px; width:22px; height:22px; padding:0;
    border:1.5px solid #b3261e; border-radius:50%; background:#fff; color:#b3261e;
    font:700 15px/19px var(--sans); text-align:center; cursor:pointer;
  }
  #editor .task.selected .task-x{display:block}
  #editor .task .task-x:hover{background:#b3261e; color:#fff}

  /* Button „Neuen Aufgabentext eintragen" – schwebt immer eine Zeile unter der aktuellen Eingabezeile */
  .taskbtn{
    position:absolute; left:60px; top:56px; z-index:3; font-family:var(--sans); font-size:12.5px; font-weight:600;
    letter-spacing:.01em; color:#b3261e; background:var(--paper2); border:1px dashed #d9a39c; border-radius:8px;
    padding:5px 11px; cursor:pointer; white-space:nowrap; transition:background .12s;
  }
  .taskbtn:hover{background:#fdecea}
  .taskbtn:active{transform:translateY(1px)}
  .taskform{
    position:absolute; left:60px; right:60px; top:56px; z-index:4; background:var(--paper2);
    border:1.5px solid #b3261e; border-radius:10px; padding:14px 16px; box-shadow:0 18px 40px -22px var(--shadow);
  }
  .taskform label{color:#b3261e}
  .taskform textarea{
    display:block; width:100%; min-height:74px; resize:vertical; font-family:var(--serif); font-size:17px; line-height:1.5;
    color:var(--ink); background:var(--paper); border:1px solid var(--line); border-radius:9px; padding:9px 12px; outline:none;
  }
  .taskform textarea:focus{border-color:#b3261e; box-shadow:0 0 0 3px rgba(179,38,30,.14)}
  .taskform .row{display:flex; gap:10px; justify-content:flex-end; margin-top:10px}
  .taskform .btn{padding:9px 14px; font-size:14px}

  /* ---------- Formatierungsleiste (Word-artig) ---------- */
  .formatbar{
    display:flex; align-items:center; gap:8px; flex-wrap:wrap;
    padding:9px 22px; border-bottom:1px solid var(--line); background:var(--paper2);
  }
  .fbtn{
    font-family:var(--sans); font-size:15px; min-width:38px; height:34px; padding:0 11px;
    color:var(--ink); background:var(--paper); border:1px solid var(--line); border-radius:8px;
    cursor:pointer; display:inline-flex; align-items:center; justify-content:center;
    transition:background .12s, border-color .12s, color .12s; user-select:none;
  }
  .fbtn:hover{background:#efe9dd}
  .fbtn:active{transform:translateY(1px)}
  .fbtn.active{background:var(--accent); color:var(--paper2); border-color:var(--accent)}
  .fbtn.wide{font-size:13.5px; letter-spacing:.02em}
  .fbtn .b{font-weight:800}
  .fbtn .i{font-style:italic}
  .fbtn .u{text-decoration:underline}
  .fsep{width:1px; height:22px; background:var(--line); margin:0 3px}
  .actionbar{
    position:fixed; left:0; right:0; bottom:0; display:flex; flex-direction:column; align-items:center; gap:12px;
    padding:16px 16px 46px; background:linear-gradient(to top, var(--paper) 60%, rgba(247,244,236,0));
  }
  .dl-panel{display:flex; flex-direction:column; align-items:center; gap:9px}
  .dl-hint{font-size:12.5px; color:var(--muted); text-align:center}
  .dl-row{display:flex; gap:10px; flex-wrap:wrap; justify-content:center}
  .dl-link{text-decoration:none; font-size:13.5px; padding:9px 14px}
  .copyright{
    position:fixed; left:0; right:0; bottom:13px; text-align:center;
    font-size:11px; letter-spacing:.05em; color:var(--muted); pointer-events:none; z-index:6;
  }
  .copyright a{pointer-events:auto; color:var(--muted); text-decoration:underline; text-underline-offset:2px}
  .copyright a:hover{color:var(--accent)}

  /* ---------- Lehrkraft ---------- */
  #screen-teacher{display:none; place-items:start center; padding:40px 20px 80px}
  #screen-teacher.active{display:grid}
  .panel{width:100%; max-width:920px}
  .panel h1{font-family:var(--serif); font-weight:600; font-size:26px; margin:0 0 4px}
  .panel .sub{color:var(--muted); margin:0 0 22px; font-size:14.5px}
  .drop{
    background:var(--paper2); border:1.5px dashed var(--line); border-radius:12px;
    padding:26px; text-align:center; color:var(--muted); font-size:14.5px;
  }
  .drop strong{color:var(--ink)}
  .row{display:flex; gap:12px; flex-wrap:wrap; align-items:center; margin-top:14px}
  input[type=password]{
    font-family:var(--serif); font-size:18px; letter-spacing:.12em; width:180px;
    background:var(--paper); border:1px solid var(--line); border-radius:9px; padding:10px 12px; outline:none;
  }
  input[type=password]:focus{border-color:var(--accent2); box-shadow:0 0 0 3px rgba(138,106,60,.16)}
  .hidden{display:none !important}
  .backlink{display:inline-block; margin-bottom:18px; color:var(--muted); font-size:13px; text-decoration:none}
  .backlink:hover{color:var(--accent)}

  /* analysis */
  .legend{display:flex; gap:18px; flex-wrap:wrap; margin:20px 0 14px; font-size:13.5px; color:var(--muted)}
  .legend span{display:inline-flex; align-items:center; gap:7px}
  .sw{width:13px; height:13px; border-radius:3px; display:inline-block}
  .stat{font-size:13px; color:var(--muted); margin:0 0 16px; font-variant-numeric:tabular-nums}
  .analysis{
    background:var(--paper2); border:1px solid var(--line); border-radius:10px;
    padding:30px 34px; font-family:var(--serif); font-size:17.5px; line-height:1.85;
    white-space:pre-wrap; word-wrap:break-word; overflow-wrap:anywhere;
  }
  .nmeta{font-family:var(--sans); font-size:12.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); margin-bottom:14px}
  .redbadge{
    display:inline-block; font-family:var(--sans); font-size:14px; font-weight:600; letter-spacing:.02em;
    background:var(--paper2); border:1px solid var(--line); border-radius:9px; padding:8px 14px;
    margin:0 0 6px; font-variant-numeric:tabular-nums;
  }
  .redbadge.high{color:#b3261e; border-color:#b3261e; font-weight:800}
  .codefor{font-size:13.5px; color:var(--muted); margin:14px 0 0}

  /* Tabellenansicht (Mehrfach-Upload) */
  .batchsum{font-size:13px; color:var(--muted); margin:18px 0 10px; font-variant-numeric:tabular-nums}
  .tablewrap{border:1px solid var(--line); border-radius:10px; overflow:auto; background:var(--paper2)}
  table.batch{width:100%; border-collapse:collapse; font-size:15px}
  table.batch th{
    font-family:var(--sans); font-size:12px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted);
    font-weight:600; text-align:left; padding:10px 14px; border-bottom:1px solid var(--line); background:var(--paper);
  }
  table.batch td{padding:10px 14px; border-bottom:1px solid var(--line); font-family:var(--serif); font-variant-numeric:tabular-nums}
  table.batch tr:last-child td{border-bottom:0}
  table.batch tr.clickable{cursor:pointer}
  table.batch tr.clickable:hover td, table.batch tr.selected td{background:#efe9dd}
  table.batch th.pct, table.batch td.pct{text-align:right; white-space:nowrap}
  table.batch td.pct.high{color:#b3261e; font-weight:800}
  table.batch tr.errrow td{color:var(--muted); font-style:italic; font-family:var(--sans); font-size:13.5px}
  .batchhint{font-size:12.5px; color:var(--muted); margin:10px 0 0}

  /* Rote Felder (Escape-Room-Modus, identisch zum eingebetteten Feiditor) */
  .moodle-hints{max-width:760px; margin:0 auto}
  .moodle-hint{
    max-width:760px; margin:14px auto 0; padding:14px 20px;
    background:#fdecea; border:1.5px solid #f5b8b1; border-radius:8px;
    color:#a72020; font-family:var(--sans); font-size:14.5px; font-weight:600;
    text-align:center; line-height:1.5;
    user-select:none;
  }
  /* Upload-Bereiche auf der Startseite (Überblick-PDF, Zwischenstand-PDF) */
  .startsec .drop{padding:18px}
</style>
</head>
<body>

<!-- ============ START ============ -->
<section id="screen-start" class="screen active">
  <div class="start-wrap">
    <div class="card">
      <p class="brand">Feiditor</p>
      <h1>Bevor du beginnst</h1>

      <!-- Schritt 1: Auswahl, was zutrifft -->
      <div id="choice">
        <p class="sub">Bitte klicke an, was auf dich zutrifft.</p>
        <button type="button" class="btn block choice-btn" id="choose-normal">Ich möchte den normalen Feiditor öffnen</button>
        <button type="button" class="btn block ghost choice-btn" id="choose-escape">Ich komme aus einem Escape-Room und möchte mithilfe meiner Überblicks-PDF nun die Feiditor-PDF-Aufgaben laden</button>
        <button type="button" class="btn block ghost choice-btn" id="choose-resume">Ich möchte meinen Feiditor-Zwischenstand hochladen und weiterarbeiten</button>
      </div>

      <!-- Schritt 2a: normaler Start mit Namen -->
      <div id="sec-normal" class="startsec hidden">
        <p class="sub">Bitte trage deinen Namen ein. Danach öffnet sich der Schreibbereich.</p>
        <div class="field">
          <label for="vorname">Vorname</label>
          <input type="text" id="vorname" autocomplete="off" spellcheck="false">
        </div>
        <div class="field">
          <label for="nachname">Nachname</label>
          <input type="text" id="nachname" autocomplete="off" spellcheck="false">
        </div>
        <p class="err" id="start-err"></p>
        <button class="btn block" id="start-btn">Schreibbereich öffnen</button>
      </div>

      <!-- Schritt 2b: Escape-Room – Name und Aufgaben aus der Überblick-PDF laden -->
      <div id="sec-escape" class="startsec hidden">
        <p class="sub">Lade hier deine <strong>Überblick-PDF</strong> aus dem Escape-Room hoch – der Feiditor öffnet sich dann mit deinem Namen und deinen Aufgaben.</p>

    const body=str.substr(start,n); re.lastIndex=start+n;
    if(body.startsWith(OVERVIEW_MARK+"\n")) out.push(body.slice(OVERVIEW_MARK.length+1).replace(/\n+$/,""));
    else if(all||TITLE.test(body.slice(0,400))) out.push(body.replace(/\n+$/,""));
  }
  return out;
}

/* ============================================================
   ESCAPE-ROOM-ÜBERSICHTS-SEITEN
   Jeder Escape-Room ergänzt an dieser Stelle seine eigene Funktion
   buildOverviewPages(ov) (liefert die Content-Streams seiner Übersichts-
   Seiten). Fehlt sie – wie im Standalone- und Lerntagebuch-Feiditor –,
   hat die PDF keine Übersichts-Seiten.
   ============================================================ */
function buildOverviewPages(ov){
  const doc=new PdfDoc();
  const W=doc.pageW,H=doc.pageH,M=doc.margin; const CW=W-2*M;
  const PRIMARY=[31,78,95], ACCENT=[169,119,42], RED=[177,68,47], GREEN=[47,125,65], MUTE=[108,120,136], TEXT=[29,39,51];
  const attempts=Array.isArray(ov.attempts)?ov.attempts:[];
  const mistakes=Array.isArray(ov.mistakes)?ov.mistakes:[];
  const roomLabels=Array.isArray(ov.roomLabels)?ov.roomLabels:[];
  const notes=Array.isArray(ov.solutionNotes)?ov.solutionNotes:[];
  const subtitle=ov.subtitle||'';
  const resumeNotes=Array.isArray(ov.resumeNotes)?ov.resumeNotes:[];

  // Vermerk für die Lehrkraft: Wurde eine Zwischenstand-Datei geladen – und wo ging es weiter?
  function resumeSection(y,ens){
    y=ens(y,60);
    doc.text('Verwendung von Zwischenstand-Dateien',M,y,12.5,true,PRIMARY);
    doc.line(M,y-4,M+CW,y-4,ACCENT,0.8);
    y-=18;
    for(const line of resumeNotes){ y=ens(y,20); y=doc.paragraph(String(line),M,y,CW,10.5,false,TEXT,14.5); y-=2; }
    return y-12;
  }

  function header(title){
    doc.startPage();
    doc.rect(0,H-72,W,72,PRIMARY);
    doc.text(title,M,H-38,18,true,[255,255,255]);
    if(subtitle) doc.text(subtitle,M,H-58,9,false,[214,226,228]);
    return H-72-22;
  }
  function ensure(y,need){ if(y-need<70){ doc.endPage(); return header('Überblick deiner Antworten & Erläuterungen'); } return y; }

  let y=header('Überblick deiner Antworten & Erläuterungen');

  // Pflichthinweis (fett) — KEIN Notfall-Tipp (die kombinierte PDF trägt kein %ESCAPEDATA)
  doc.rect(M,y-44,CW,44,[248,235,221]);
  doc.rect(M,y-44,3,44,ACCENT);
  doc.paragraph('Diese Datei musst du bei Moodle in der dafür vorgesehenen Abgabe hochladen, um deinem Lehrer nachzuweisen, dass du den Escape-Room erfolgreich absolviert hast.',
    M+12,y-16,CW-24,10.5,true,PRIMARY,13.5);
  y-=44+14;

  // Identifikationsblock
  const blockH=78;
  doc.rect(M,y-blockH,CW,blockH,[244,248,249]);
  doc.rect(M,y-blockH,3,blockH,ACCENT);
  doc.text('NAME',M+14,y-16,8,true,ACCENT);
  const nameStr=(ov.firstName||'')+' '+(ov.lastName||'');
  doc.text(nameStr,M+14,y-31,pdfStringWidth(nameStr,13,true)>270?10:13,true,PRIMARY);   // lange Namen kleiner, damit sie nicht in die Code-Spalte laufen
  doc.text('GEBURTSDATUM',M+14,y-49,8,true,ACCENT);
  doc.text(ov.birthDate||'',M+14,y-63,11,false,TEXT);
  doc.text('BESTÄTIGUNGSCODE',M+300,y-16,8,true,ACCENT);
  doc.text(String(ov.code||''),M+300,y-31,13,true,PRIMARY);
  doc.text('ABGESCHLOSSEN AM',M+300,y-49,8,true,ACCENT);
  doc.text(ov.completedAt||'',M+300,y-63,11,false,TEXT);
  y-=blockH+18;

  y=doc.paragraph('Diese Seiten zeigen dir, welche Antworten du in jedem Rätselraum beim ersten Versuch gegeben hast. Jeden Raum hast du am Ende erfolgreich gelöst – diese Übersicht zeigt nur, wo es anfangs noch hakte. Danach findest du ausführliche Lösungserläuterungen.',
    M,y,CW,10.5,false,TEXT,14);
  y-=8;

  const totalErrors=mistakes.reduce((a,m)=>a+(m&&m.errors?m.errors.length:0),0);
  const perfectRooms=attempts.filter((a,i)=>a>=1 && (!mistakes[i]||!mistakes[i].errors||mistakes[i].errors.length===0)).length;
  doc.rect(M,y-34,CW,34,[233,243,234]);
  doc.rect(M,y-34,3,34,GREEN);
  doc.text('ÜBERSICHT',M+14,y-13,8,true,GREEN);
  doc.text(`Räume im ersten Versuch fehlerfrei: ${perfectRooms} von ${roomLabels.length||6}   ·   Fehler im ersten Versuch insgesamt: ${totalErrors}`,M+14,y-26,10.5,true,TEXT);
  y-=48;

  for(let i=0;i<roomLabels.length;i++){
    y=ensure(y,64);
    doc.text(roomLabels[i],M,y,12.5,true,PRIMARY);
    doc.line(M,y-4,M+CW,y-4,ACCENT,0.8);
    y-=18;
    const att=attempts[i]; const m=mistakes[i];
    const attemptsLabel=att===1?'1 Versuch':att+' Versuche';
    if(!m||!m.errors||m.errors.length===0){
      y=doc.paragraph('Fehlerfrei beim ersten Versuch gelöst. ('+attemptsLabel+')',M,y,CW,10.5,true,GREEN,14); y-=8; continue;
    }
    y=doc.paragraph('Benötigt: '+attemptsLabel+'. Beim ersten Versuch war Folgendes nicht korrekt:',M,y,CW,10.5,false,MUTE,14); y-=4;
    for(const err of m.errors){
      y=ensure(y,52);
      doc.text('•',M,y,11,true,RED);
      if(err.kind==='mc_falsch'){
        y=doc.paragraph(err.item,M+14,y,CW-14,10.5,true,TEXT,13);
        y=doc.paragraph('Deine Wahl: '+err.wrongAnswer,M+14,y,CW-14,10,false,RED,13);
        y=doc.paragraph('Richtig: '+err.correctAnswer,M+14,y,CW-14,10,true,GREEN,13);
      } else if(err.kind==='luecke_falsch'){
        y=doc.paragraph(err.item,M+14,y,CW-14,10.5,true,TEXT,13);
        y=doc.paragraph('Deine Wahl: '+err.wrongAnswer+'   ·   Richtig: '+err.correctAnswer,M+14,y,CW-14,10,false,MUTE,13);
      } else if(err.kind==='zuordnung_falsch'){
        y=doc.paragraph(err.item,M+14,y,CW-14,10.5,true,TEXT,13);
        y=doc.paragraph('Du zugeordnet: '+err.wrongAnswer+'   ·   Richtig: '+err.correctAnswer,M+14,y,CW-14,10,false,MUTE,13);
      } else if(err.kind==='falsch_gewaehlt'){
        y=doc.paragraph('Falsch ausgewählt: "'+err.item+'"',M+14,y,CW-14,10.5,true,TEXT,13);
        if(err.explanation) y=doc.paragraph('→ '+err.explanation,M+14,y,CW-14,10,false,MUTE,13);
      } else if(err.kind==='uebersehen'){
        y=doc.paragraph('Übersehen (gehörte dazu): "'+err.item+'"',M+14,y,CW-14,10.5,true,TEXT,13);
        if(err.explanation) y=doc.paragraph('→ '+err.explanation,M+14,y,CW-14,10,false,MUTE,13);
      } else if(err.kind==='falsch_einsortiert'){
        y=doc.paragraph('"'+err.item+'"',M+14,y,CW-14,10.5,true,TEXT,13);
        y=doc.paragraph('Du einsortiert: '+err.wrongAnswer+'   ·   Richtig: '+err.correctAnswer,M+14,y,CW-14,10,false,MUTE,13);
      } else if(err.kind==='falsche_eingabe'){
        y=doc.paragraph(err.item,M+14,y,CW-14,10.5,true,TEXT,13);
        y=doc.paragraph('Deine Eingabe: "'+err.wrongAnswer+'"   ·   Richtig: '+err.correctAnswer,M+14,y,CW-14,10,false,MUTE,13);
      }
      y-=5;
    }
    y-=10;
  }
  // ohne Lösungserläuterungen: Vermerk ans Ende der Antwort-Übersicht
  if(resumeNotes.length && !notes.length) y=resumeSection(y,ensure);

  y=ensure(y,40);
  doc.line(M,y,M+CW,y,[200,200,200],0.4); y-=14;
  doc.text('Bestätigungscode für Moodle: '+String(ov.code||''),M,y,10,true,PRIMARY);
  y-=22;
  doc.text('Copyright Jan-Rickmer Feindt',M,y,8.5,false,MUTE);
  doc.endPage();

  /* ---- Lösungserläuterungen ---- */
  if(notes.length){
    let y2=header('Lösungserläuterungen');
    y2=doc.paragraph('Hier werden die richtigen Lösungen der sechs Rätselräume noch einmal genauer erklärt. Nutze diese Seite, um den Stoff der Sitzung zu vertiefen.',M,y2,CW,10.5,false,TEXT,14);
    y2-=10;
    function ensure2(y,need){ if(y-need<70){ doc.endPage(); return header('Lösungserläuterungen'); } return y; }
    for(const note of notes){
      y2=ensure2(y2,90);
      doc.text(note.room,M,y2,12.5,true,PRIMARY);
      doc.line(M,y2-4,M+CW,y2-4,ACCENT,0.8);
      y2-=18;
      y2=doc.paragraph(note.text,M,y2,CW,10.5,false,TEXT,14.5);
      y2-=14;
    }
    if(resumeNotes.length) y2=resumeSection(y2,ensure2);
    y2=ensure2(y2,30);
    doc.line(M,y2,M+CW,y2,[200,200,200],0.4); y2-=14;
    doc.text('Copyright Jan-Rickmer Feindt',M,y2,8.5,false,MUTE);
    doc.endPage();
  }
  return doc.pages.map(p=>p.content);
}

function buildPdf(opts){
  const PW=595.28,PH=841.89, ML=56,MR=56,MT=56,MB=64;
  const HEAD_SIZE=13, BODY_SIZE=11, HEAD2_SIZE=22, NOTE_SIZE=11;
  const BODY_LEAD=15.5, HEAD_LEAD=28;
  const usableW=PW-ML-MR;
  const headerBaseline=PH-MT-HEAD_SIZE, ruleY=headerBaseline-6, bodyTop=ruleY-22, bodyBottom=MB+24;

  const text=opts.text||""; const fmt=opts.fmt||[];
  // in Absätze an '\n' teilen
  const paras=[]; { let cur=[]; for(let i=0;i<text.length;i++){ const ch=text[i]; if(ch==="\n"){paras.push(cur);cur=[];} else { const ft=fmt[i]||{}; cur.push({ch,b:!!ft.b,i:!!ft.i,u:!!ft.u,h:!!ft.h}); } } paras.push(cur); }

  // Anzeigezeilen mit Größe/Durchschuss
  const dispLines=[];
  for(const para of paras){
    const heading=para.length?para[0].h:false;
    const size=heading?HEAD2_SIZE:BODY_SIZE;
    const lead=heading?HEAD_LEAD:BODY_LEAD;
    if(para.length===0){ dispLines.push({runs:[],size:BODY_SIZE,lead:BODY_LEAD}); continue; }
    const wrapped=wrapPara(para,size,usableW);
    for(const wl of wrapped) dispLines.push({runs:lineToRuns(wl),size,lead});
  }
  if(dispLines.length===0) dispLines.push({runs:[],size:BODY_SIZE,lead:BODY_LEAD});

  // Seiten füllen
  const pages=[]; let idx=0;
  while(idx<dispLines.length){
    const pageLines=[]; let y=bodyTop;
    while(idx<dispLines.length && y>=bodyBottom){ const dl=dispLines[idx]; pageLines.push({dl,y}); y-=dl.lead; idx++; }
    if(pageLines.length===0){ pageLines.push({dl:dispLines[idx],y:bodyTop}); idx++; }
    pages.push({lines:pageLines});
  }
  const nPages=pages.length;
  // Übersichts-Seiten (aus dem Escape-Room) werden hinter die Aufgaben-Seiten gehängt: im eingebetteten Feiditor neu
  // erzeugt, im eigenständigen Feiditor aus der hochgeladenen Überblick- bzw. Zwischenstand-PDF übernommen
  const ovStreams=(opts.overview&&typeof buildOverviewPages==="function")?buildOverviewPages(opts.overview)
    :(Array.isArray(opts.overviewStreams)?opts.overviewStreams:[]);
  const nAll=nPages+ovStreams.length;

  const noteText="Bitte diese PDF-Datei herunterladen und bei Moodle hochladen.";
  const noteLines=[]; { // Hinweis ist immer normal/unformatiert
    const arr=noteText.split("").map(ch=>({ch,b:false,i:false,u:false}));
    for(const wl of wrapPara(arr,NOTE_SIZE,usableW)) noteLines.push(lineToRuns(wl));
  }
  const noteBottom=46;

  const pageObjNum=(i)=>7+i*2, contObjNum=(i)=>8+i*2;
  const objects={};
  objects[1]="<< /Type /Catalog /Pages 2 0 R >>";
  objects[2]=`<< /Type /Pages /Count ${nAll} /Kids [${Array.from({length:nAll},(_,i)=>`${pageObjNum(i)} 0 R`).join(" ")}] >>`;
  objects[3]="<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>";
  objects[4]="<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>";
  objects[5]="<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Oblique /Encoding /WinAnsiEncoding >>";
  objects[6]="<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-BoldOblique /Encoding /WinAnsiEncoding >>";

  for(let i=0;i<nPages;i++){
    objects[pageObjNum(i)]=`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${PW.toFixed(2)} ${PH.toFixed(2)}] /Resources << /Font << /F1 3 0 R /F2 4 0 R /F3 5 0 R /F4 6 0 R >> >> /Contents ${contObjNum(i)} 0 R >>`;
    let s="0.5 w\n";
    // Name + Linie
    s+=`BT /F1 ${HEAD_SIZE} Tf 0 0 0 rg ${ML} ${headerBaseline.toFixed(2)} Td (${encStr(opts.name||"")}) Tj ET\n`;
    s+=`${ML} ${ruleY.toFixed(2)} m ${(PW-MR).toFixed(2)} ${ruleY.toFixed(2)} l S\n`;
    // Textzeilen
    const underlines=[];
    for(const pl of pages[i].lines){
      const dl=pl.dl, y=pl.y;
      if(dl.runs.length){
        s+=`BT 1 0 0 1 ${ML.toFixed(2)} ${y.toFixed(2)} Tm 0 0 0 rg\n`;
        let x=ML;
        for(const run of dl.runs){
          const fn=fontFor(run.b,run.i);
          s+=`/${fn} ${dl.size} Tf (${encStr(run.text)}) Tj\n`;
          const rw=runWidth(run.text,run.b,dl.size);
          if(run.u){ underlines.push({x1:x,x2:x+rw,y:y-dl.size*0.12,lw:Math.max(0.5,dl.size*0.06)}); }
          x+=rw;
        }
        s+="ET\n";
      }
    }
    for(const ul of underlines){
      s+=`${ul.lw.toFixed(2)} w 0 0 0 RG ${ul.x1.toFixed(2)} ${ul.y.toFixed(2)} m ${ul.x2.toFixed(2)} ${ul.y.toFixed(2)} l S\n`;
    }
    // roter Hinweis nur auf der letzten Seite
    if(i===nPages-1){
      let yy=noteBottom+(noteLines.length-1)*BODY_LEAD;
      for(const runs of noteLines){
        s+=`BT 1 0 0 1 ${ML.toFixed(2)} ${yy.toFixed(2)} Tm 0.78 0.05 0.05 rg\n`;
        for(const run of runs){ s+=`/F1 ${NOTE_SIZE} Tf (${encStr(run.text)}) Tj\n`; }
        s+="ET\n";
        yy-=BODY_LEAD;
      }
    }
    objects[contObjNum(i)]={stream:s};
  }
  // Übersichts-Seiten anhängen (Content-Streams nutzen /F1 und /F2, die oben definiert sind)
  for(let k=0;k<ovStreams.length;k++){
    const i=nPages+k;
    objects[pageObjNum(i)]=`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${PW.toFixed(2)} ${PH.toFixed(2)}] /Resources << /Font << /F1 3 0 R /F2 4 0 R /F3 5 0 R /F4 6 0 R >> >> /Contents ${contObjNum(i)} 0 R >>`;
    objects[contObjNum(i)]={stream:OVERVIEW_MARK+"\n"+ovStreams[k]+"\n"};   // markiert: so findet der eigenständige Feiditor die Seiten beim Fortsetzen
  }

  let pdf="%PDF-1.7\n%\u00E2\u00E3\u00CF\u00D3\n";
  if(opts.trackB64) pdf+=`%TRACKDATA ${opts.trackB64}\n`;
  const offsets={}; const maxNum=6+nAll*2;
  for(let n=1;n<=maxNum;n++){
    offsets[n]=pdf.length; const o=objects[n];
    if(o&&o.stream!==undefined){const st=o.stream;pdf+=`${n} 0 obj\n<< /Length ${st.length} >>\nstream\n${st}endstream\nendobj\n`;}
    else pdf+=`${n} 0 obj\n${o}\nendobj\n`;
  }
  const xrefStart=pdf.length;
  pdf+=`xref\n0 ${maxNum+1}\n0000000000 65535 f \n`;
  for(let n=1;n<=maxNum;n++) pdf+=String(offsets[n]).padStart(10,"0")+" 00000 n \n";
  pdf+=`trailer\n<< /Size ${maxNum+1} /Root 1 0 R >>\nstartxref\n${xrefStart}\n%%EOF`;
  return pdf;
}

/* ---------------- gemeinsame Krypto- & Auswertungs-Funktionen ---------------- *
 * Diese werden per toString() in die Lehrkraft-Seite (data:-Link) eingebettet,  *
 * damit es nur EINE Quelle der Wahrheit gibt.                                   */
function bytesToB64(bytes){let bin="";const CH=0x8000;for(let i=0;i<bytes.length;i+=CH)bin+=String.fromCharCode.apply(null,bytes.subarray(i,i+CH));return btoa(bin);}
function b64ToBytes(b64){const bin=atob(b64);const out=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)out[i]=bin.charCodeAt(i);return out;}
async function _key(codeStr,usage){const mat=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(codeStr));return crypto.subtle.importKey("raw",mat,{name:"AES-GCM"},false,usage);}
async function aesEncrypt(plain,codeStr){const iv=crypto.getRandomValues(new Uint8Array(12));const key=await _key(codeStr,["encrypt"]);const ct=await crypto.subtle.encrypt({name:"AES-GCM",iv},key,new TextEncoder().encode(plain));return bytesToB64(iv)+":"+bytesToB64(new Uint8Array(ct));}
async function aesDecrypt(bundle,codeStr){const parts=bundle.split(":");const iv=b64ToBytes(parts[0]);const ct=b64ToBytes(parts[1]);const key=await _key(codeStr,["decrypt"]);const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv},key,ct);return new TextDecoder().decode(pt);}
function esc(s){return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));}
function classify(isVisible,src,gap){
  const COL={plain:"#23201b",paste:"#b3261e",fast:"#c2710c",slow:"#1f7a34",system:"#23201b"};
  if(src==="s"||src==="q") return COL.system; // vorgegebener Aufgabentext (bzw. Frage älterer Lerntagebuch-PDFs) -> schwarz, nie farbig
  if(!isVisible) return COL.plain;
  if(src==="p") return COL.paste;            // aus Zwischenablage -> rot
  if(gap>=0&&gap<=15) return COL.paste;      // <= 0,015 s getippt -> rot
  if(gap>15&&gap<=70) return COL.fast;       // 0,015-0,07 s -> orange
  return COL.slow;                           // > 0,07 s / erstes Zeichen -> grün
}
const RED_LIMIT=50; // Rot-Anteil strikt ÜBER diesem Wert wird rot und fett hervorgehoben
/* Zählt sichtbare, nicht vorgegebene Zeichen nach Farbe – EINE Formel für Einzelansicht, Export und Tabelle */
function computeStats(t,m){
  const WS=/\s/; let total=0,red=0,orange=0,green=0;
  for(let i=0;i<t.length;i++){
    const ch=t[i]; const isV=!WS.test(ch);
    const mark=m[i]||["t",-1]; const col=classify(isV,mark[0],mark[1]);
    if(isV && mark[0]!=="s" && mark[0]!=="q"){ total++;
      if(col==="#b3261e") red++;
      else if(col==="#c2710c") orange++;
      else green++;
    }
  }
  const pct=(x)=>total?Math.round(x/total*100):0;
  return {total,red,orange,green,redPct:pct(red),orangePct:pct(orange),greenPct:pct(green)};
}
function renderAnalysis(payload){
  const t=payload.t, m=payload.m||[], f=payload.f||[];
  let html="";
  const WS=/\s/;
  for(let i=0;i<t.length;i++){
    const ch=t[i]; const isV=!WS.test(ch);
    const mark=m[i]||["t",-1]; const src=mark[0]; const gap=mark[1];
    const col=classify(isV,src,gap);
    const fl=f[i]||0; let st="color:"+col;
    if(fl&8){ st+=";font-weight:700;font-size:1.6em"; } else if(fl&1){ st+=";font-weight:700"; }
    if(fl&2) st+=";font-style:italic";
    if(fl&4) st+=";text-decoration:underline";
    html+=`<span style="${st}">${esc(ch)}</span>`;
  }
  const s=computeStats(t,m);
  // gespeicherter Rot-Anteil aus der PDF; ältere PDFs ohne Wert: aus den Tracking-Daten berechnet
  const rp=(typeof payload.r==="number"&&isFinite(payload.r))?payload.r:s.redPct;
  const badge=`<div class="redbadge${rp>RED_LIMIT?" high":""}">Rot-Anteil: ${rp} %</div>`;
  const legend=
    '<div class="legend">'+
      '<span><i class="sw" style="background:#b3261e"></i>eingefügt oder ≤ 0,015 s getippt</span>'+
      '<span><i class="sw" style="background:#c2710c"></i>0,015–0,07 s nach vorherigem Zeichen getippt</span>'+
      '<span><i class="sw" style="background:#1f7a34"></i>&gt; 0,07 s nach vorherigem Zeichen getippt</span>'+
      '<span><i class="sw" style="background:#23201b"></i>vorgegebener Aufgabentext (nicht gewertet)</span>'+
    '</div>';
  const stat=`<p class="stat">Zeichen gesamt: ${s.total} · rot: ${s.red} (${s.redPct} %) · orange: ${s.orange} (${s.orangePct} %) · grün: ${s.green} (${s.greenPct} %)</p>`;
  const head=`<div class="nmeta">Verfasser:in — ${esc(payload.n||"")}${payload.z===1?" · Zwischenstand":""}</div>`;
  return head+badge+legend+stat+`<div class="analysis">${html}</div>`;
}

/* ---------------- Lehrkraft-Seite für den data:-Link bauen ---------------- */
function buildTeacherHtml(bundle){
  const shared="const RED_LIMIT="+RED_LIMIT+";\n"+[bytesToB64,b64ToBytes,_key,aesDecrypt,esc,classify,computeStats,renderAnalysis].map(f=>f.toString()).join("\n");
  const css=
    'body{margin:0;background:#f7f4ec;color:#221f1a;font-family:"Avenir Next",Avenir,"Segoe UI","Helvetica Neue",system-ui,sans-serif;line-height:1.5}'+
    '.wrap{max-width:920px;margin:0 auto;padding:40px 22px 80px}'+

/* ----------------------- geheime Code-Bildung (Lehrkraft) ----------------------- */
function _kfN(n){return String(n*(0x230+0x220));}          // Code aus Buchstabenzahl
function _kf(s){const n=(s.match(/\p{L}/gu)||[]).length;return _kfN(n);}

/* ------------------------------ Tracking ------------------------------ */
let prevValue="";
let recs=[];          // pro Zeichen: {src:'t'|'p'|'s', t:ms} – 's' = vorgegebener Aufgabentext (t=-1: kein Tipp-Tempo)
let justPasted=false; // wird durch paste/drop gesetzt, nach einem input-Event geleert

function reconcile(newVal,src,now){
  const a=prevValue,b=newVal; const minL=Math.min(a.length,b.length);
  let p=0; while(p<minL&&a[p]===b[p])p++;
  let s=0; while(s<minL-p&&a[a.length-1-s]===b[b.length-1-s])s++;
  const removed=a.length-p-s;
  const inserted=b.slice(p,b.length-s);
  const ins=inserted.split("").map(()=>({src:src,t:(src==="s")?-1:now}));
  recs.splice(p,removed,...ins);
  if(recs.length!==b.length){ // Sicherheitsnetz gegen Desync: Tipp-Info unbekannt (t=-1), nie fälschlich rot
    recs=b.split("").map(()=>({src:"t",t:-1}));
  }
  prevValue=newVal;
}
/* Aufgabenblöcke sind immer System-Text. Maßgeblich ist der Editor-Inhalt (fmt[i].s),
   nicht der Tracking-Verlauf – so wird eine Aufgabenstellung nie farbig ausgewertet. */
function applySystemFlags(fmt){
  for(let i=0;i<recs.length;i++){
    const sys=!!(fmt[i]&&fmt[i].s);
    if(sys) recs[i]={src:"s",t:-1};
    else if(recs[i].src==="s") recs[i]={src:"t",t:-1};
  }
}
/* Editor-Inhalt lesen und die Tracking-Daten daran angleichen (src: 't' getippt, 'p' eingefügt, 's' vorgegeben) */
function syncTracking(src){
  const ser=serializeEditor();
  reconcile(ser.text,src,Date.now());
  applySystemFlags(ser.fmt);
  return ser;
}

/* Hintergrunddaten für die PDF: Text (t), Marken je Zeichen (m: Quelle + Abstand), Format-Bits (f),
   Blockstruktur (k: je Block [Art 0=Zeile/1=Aufgabe, Zeichenzahl, Labellänge]) und Escape-Infos (e).
   Alle Längen und Indizes zählen UTF-16-Einheiten wie t (v:2; ältere Dateien zählten k in Unicode-Zeichen).
   z = versteckte Kennung: 1 = Zwischenstand, 0 = fertige Abgabe. Sie steckt wie alles andere verschlüsselt
   (AES-GCM) in %TRACKDATA und lässt sich ohne Entschlüsseln nicht verändern.
   Aus diesen Daten kann ein Zwischenstand vollständig wiederhergestellt werden. */
function buildPayload(name,ser,vn,nn,interim){
  const text=ser.text, fmt=ser.fmt||[];
  if(recs.length!==text.length){ // letzte Absicherung: Tipp-Info verloren -> Abstand unbekannt (nie fälschlich rot)
    recs=text.split("").map(()=>({src:"t",t:-1}));
  }
  const m=[]; const f=[];
  for(let i=0;i<text.length;i++){
    const ft=fmt[i]||{}; const rc=recs[i];
    const src=ft.s?"s":rc.src;
    let gap;
    if(src==="s"||i===0) gap=-1;
    else if(typeof rc.g==="number") gap=rc.g;                      // aus einem Zwischenstand übernommener Zeitwert
    else gap=(rc.t<0||recs[i-1].t<0)?-1:(rc.t-recs[i-1].t);
    m.push([src,gap]);
    let bits=0; if(ft.b)bits|=1; if(ft.i)bits|=2; if(ft.u)bits|=4; if(ft.h)bits|=8; if(ft.s)bits|=16;
    f.push(bits);
  }
  const r=computeStats(text,m).redPct; // Rot-Anteil in Prozent, wie ihn die Lehrkraft-Ansicht zeigt
  const p={n:name,t:text,m,f,vn:vn||"",nn:nn||"",r,k:ser.blocks||[],v:2,z:interim?1:0};
  if(escapeMode){ p.e={esc:true,red:escapeRed}; if(escapeCtx) p.e.ctx=escapeCtx; }
  return p;
}

function sanitize(s){return (s||"").replace(/[^\p{L}\p{N}_-]/gu,"_").slice(0,40)||"Datei";}
function asciiName(s){
  return (s||"")
    .replace(/ä/g,"ae").replace(/ö/g,"oe").replace(/ü/g,"ue")
    .replace(/Ä/g,"Ae").replace(/Ö/g,"Oe").replace(/Ü/g,"Ue").replace(/ß/g,"ss")
    .normalize("NFKD").replace(/[\u0300-\u036f]/g,"")
    .replace(/[^A-Za-z0-9_-]/g,"_").replace(/_+/g,"_").replace(/^_|_$/g,"")
    .slice(0,40) || "Datei";
}
function fileSafe(s){return (s||"").replace(/[\/\\:*?"<>|\u0000-\u001f]/g,"").replace(/\s+/g," ").trim().slice(0,90)||"Datei";}
function downloadBlob(blob,filename){

/* ---------- Rich-Text-Editor: Blöcke, Aufgabenblöcke, Serialisierung ---------- */
const ed=$("editor");
function isBlockEl(node){ return !!(node&&node.nodeType===1&&/^(DIV|P|H[1-6]|LI|BLOCKQUOTE|PRE)$/.test(node.tagName)); }
function isTask(el){ return !!(el&&el.nodeType===1&&el.classList&&el.classList.contains("task")); }
function editorBlocks(){ return Array.prototype.filter.call(ed.childNodes,n=>n.nodeType===1); }
function emptyBlock(){ const d=document.createElement("div"); d.appendChild(document.createElement("br")); return d; }
function blockIsEmpty(b){ return !b || (b.textContent||"").replace(/\u200B/g,"")===""; }
/* Aufgabenblock: nicht editierbar, fett; das „x" (data-noser) wird nie mit serialisiert */
function makeTaskBlock(label,text){
  const div=document.createElement("div");
  div.className="task"; div.setAttribute("contenteditable","false"); div.setAttribute("draggable","false");
  if(label){
    const l=document.createElement("span"); l.className="task-label"; l.textContent=label;
    div.appendChild(l); div.appendChild(document.createElement("br"));
  }
  const t=document.createElement("span"); t.className="task-text"; t.textContent=text; div.appendChild(t);
  const x=document.createElement("button"); x.type="button"; x.className="task-x"; x.tabIndex=-1;
  x.setAttribute("data-noser","1"); x.setAttribute("contenteditable","false");
  x.title="Aufgabentext entfernen"; x.setAttribute("aria-label","Aufgabentext entfernen"); x.textContent="×";
  div.appendChild(x);
  return div;
}
/* Den Block (oberste DIV-Ebene im Editor), in dem ein Knoten liegt. */
function blockOf(node){
  if(!node||node===ed) return null;
  let n=node;
  while(n && n.parentNode!==ed) n=n.parentNode;
  return (n && n.parentNode===ed && n.nodeType===1) ? n : null;
}
/* Block zu einer Selektionsgrenze (Container + Offset); liegt die Grenze direkt im Editor, zählt das Kind an dieser Stelle. */
function blockAt(container,offset){
  if(container===ed){
    const kids=ed.childNodes; if(!kids.length) return null;
    const n=kids[Math.min(offset,kids.length-1)]; return (n&&n.nodeType===1)?n:null;
  }
  return blockOf(container);
}
/* Aufgabenblock, in dem ein Knoten liegt (oder null). */
function taskOf(node){ let n=node; while(n&&n!==ed){ if(isTask(n)) return n; n=n.parentNode; } return null; }

/* Read-only: liest den contenteditable-Inhalt als {text, fmt, blocks} aus, OHNE das DOM
   oder den Cursor zu verändern. Inline-Formatierung ändert den Text nicht, nur fmt –
   dadurch bleiben die Tipp-Tempo-Daten (recs) über Formatierungen hinweg erhalten.
   Jeder Block der obersten Ebene ist eine Zeile bzw. ein Aufgabenblock; Blöcke sind durch "\n" getrennt.
   fmt[i].s = Zeichen gehört zu einem Aufgabenblock (inkl. der Trenner davor/danach).
   blocks = je Block [Art (0 Zeile, 1 Aufgabe), Zeichenzahl, Labellänge] – damit lässt sich der
   Editor aus den Hintergrunddaten einer PDF exakt wiederherstellen (Zwischenstand). */
function serializeEditor(){
  const chars=[]; const fmt=[]; const blocks=[];
  const BASE={b:false,i:false,u:false,h:false,s:false};
  const SYS={b:false,i:false,u:false,h:false,s:true};
  function pushCh(ch,st){ chars.push(ch); fmt.push({b:st.b,i:st.i,u:st.u,h:st.h,s:st.s}); }
  function lastSerializable(p){
    for(let k=p.childNodes.length-1;k>=0;k--){ const c=p.childNodes[k]; if(c.nodeType===1&&c.hasAttribute("data-noser")) continue; return c; }
    return null;
  }
  function placeholderBr(node){ const p=node.parentNode; return !!p && (p===ed||isBlockEl(p)) && lastSerializable(p)===node; }
  function styleOf(el,st){
    const tag=el.tagName;
    const ns={b:st.b,i:st.i,u:st.u,h:st.h,s:st.s};
    if(tag==="B"||tag==="STRONG") ns.b=true;
    if(tag==="I"||tag==="EM") ns.i=true;
    if(tag==="U"||tag==="INS") ns.u=true;
    const sty=el.style||{};
    const fw=sty.fontWeight; if(fw==="bold"||fw==="bolder"||(fw&&parseInt(fw,10)>=600)) ns.b=true;
    const fst=sty.fontStyle; if(fst&&String(fst).indexOf("italic")>=0) ns.i=true;
    const td=(sty.textDecorationLine||sty.textDecoration||""); if(String(td).indexOf("underline")>=0) ns.u=true;
    if(el.classList&&el.classList.contains("heading")){ ns.h=true; ns.b=true; }
    if(/^H[1-6]$/.test(tag)){ ns.h=true; ns.b=true; }
    try{ const cs=getComputedStyle(el); if(cs){ const w=cs.fontWeight; if(w==="bold"||w==="bolder"||(parseInt(w,10)>=600)) ns.b=true; if(String(cs.fontStyle||"").indexOf("italic")>=0) ns.i=true; } }catch(e){}
    if(isTask(el)){ ns.s=true; ns.b=true; ns.h=false; }
    return ns;
  }
  function walk(node,st){
    const kids=node.childNodes||[];
    for(let k=0;k<kids.length;k++){
      const child=kids[k];
      if(child.nodeType===3){ const s=child.nodeValue||""; for(let q=0;q<s.length;q++) pushCh(s[q],st); }   // je UTF-16-Einheit wie t, recs und fmt (ein Emoji = 2 Einheiten)
      else if(child.nodeType===1){
        if(child.hasAttribute("data-noser")) continue;
        if(child.tagName==="BR"){ if(!placeholderBr(child)) pushCh("\n",st); continue; }
        walk(child, styleOf(child,st));
      }
    }
  }
  let cur=null, prevTask=false;
  function beginBlock(kind,taskFlag){
    if(blocks.length>0) pushCh("\n",(taskFlag||prevTask)?SYS:BASE);   // Trenner zwischen Blöcken
    cur={kind,start:chars.length,label:0};
  }
  function endBlock(){ if(cur){ blocks.push([cur.kind,chars.length-cur.start,cur.label]); prevTask=(cur.kind===1); cur=null; } }
  const kids=ed.childNodes;
  for(let k=0;k<kids.length;k++){
    const node=kids[k];
    if(node.nodeType===1&&node.hasAttribute("data-noser")) continue;
    if(node.nodeType===1&&isBlockEl(node)){
      endBlock();
      const task=isTask(node);
      beginBlock(task?1:0,task);
      walk(node, styleOf(node,BASE));
      if(task){ const lab=node.querySelector(":scope > .task-label"); cur.label=lab?(lab.textContent||"").length:0; }
      endBlock();
    } else if(node.nodeType===3||node.nodeType===1){
      // lose Text-/Inline-Knoten auf oberster Ebene (kommen nach normalizeBlocks nicht vor): als Zeile zusammenfassen
      if(!cur) beginBlock(0,false);
      if(node.nodeType===3){ const s=node.nodeValue||""; for(let q=0;q<s.length;q++) pushCh(s[q],BASE); }
      else if(node.tagName==="BR"){ if(!placeholderBr(node)) pushCh("\n",BASE); }
      else walk(node, styleOf(node,BASE));
    }
  }
  endBlock();
  return { text: chars.join(""), fmt, blocks };
}

/* Baut den Editor-Inhalt aus reinem Text neu auf (jede Zeile = ein Block-DIV). */
function setEditorText(plain){
  const root=ed; root.innerHTML="";
  const lines=String(plain||"").split("\n");
  for(const line of lines){
    const div=document.createElement("div");
    if(line==="") div.appendChild(document.createElement("br"));
    else div.appendChild(document.createTextNode(line));
    root.appendChild(div);
  }
  if(root.childNodes.length===0) root.appendChild(emptyBlock());
  updateEmpty();
}
/* Editor mit vorgegebenen Aufgaben füllen: je Aufgabe ein fester Aufgabenblock + eine leere Antwortzeile.
   Der Ausgangszustand ist komplett System-Text (grau gezählt wird nichts, nichts ist farbig). */
function fillEditor(tasks,labelFn){
  const root=ed; root.innerHTML="";
  (tasks||[]).forEach((task,i)=>{
    root.appendChild(makeTaskBlock(labelFn?labelFn(i):"", String(task==null?"":task)));
    root.appendChild(emptyBlock());
  });
  if(!root.firstChild) root.appendChild(emptyBlock());
  const ser=serializeEditor();
  prevValue=ser.text; recs=ser.text.split("").map(()=>({src:"s",t:-1}));
  applySystemFlags(ser.fmt);
  updateEmpty(); updateCharcount();
}

/* ---------- Wiederherstellung eines Zwischenstands aus den Hintergrunddaten einer PDF ---------- */
function fmtFromBits(bits){ return {b:!!(bits&1),i:!!(bits&2),u:!!(bits&4),h:!!(bits&8),s:!!(bits&16)}; }
/* Inline-Inhalt (Text mit Formatierung) in einen Zeilenblock schreiben; "\n" wird zu <br> */
function buildInline(parent,text,fmts){
  let run=null, lastBr=false;
  for(let i=0;i<text.length;i++){
    const ch=text[i]; const f=fmts[i]||{};
    if(ch==="\n"){ parent.appendChild(document.createElement("br")); run=null; lastBr=true; continue; }
    lastBr=false;
    if(!run||run.b!==!!f.b||run.i!==!!f.i||run.u!==!!f.u){
      run={b:!!f.b,i:!!f.i,u:!!f.u,node:document.createTextNode("")};
      let el=parent;
      if(run.b){ const x=document.createElement("b"); el.appendChild(x); el=x; }
      if(run.i){ const x=document.createElement("i"); el.appendChild(x); el=x; }
      if(run.u){ const x=document.createElement("u"); el.appendChild(x); el=x; }
      el.appendChild(run.node);
    }
    run.node.nodeValue+=ch;
  }
  if(lastBr||!parent.firstChild) parent.appendChild(document.createElement("br"));   // Platzhalter-<br>, damit der Umbruch erhalten bleibt
}
/* Blockstruktur k in UTF-16-Einheiten wie t. Dateien bis 29.09.2026 zählten k in Unicode-Zeichen (Codepunkten);
   nach einem Emoji passte k dann nicht mehr zu t – solche Längen werden hier umgerechnet. */
function kInUnits(t,k){
  let sum=0; k.forEach((rec,bi)=>{ sum+=(bi>0?1:0)+Math.max(0,rec[1]|0); });
  if(sum===t.length) return k;
  const out=[]; let i=0;
  const adv=(n)=>{ let j=i; while(n-->0&&j<t.length){ const c=t.charCodeAt(j); j+=(c>=0xD800&&c<=0xDBFF&&j+1<t.length&&(t.charCodeAt(j+1)&0xFC00)===0xDC00)?2:1; } return j; };
  for(let bi=0;bi<k.length;bi++){
    const rec=k[bi]; if(bi>0) i++;
    const e=adv(Math.max(0,rec[1]|0)), le=adv(Math.max(0,rec[2]|0));
    out.push([rec[0]|0,e-i,le-i]); i=e;
  }
  return i===t.length?out:k;
}
/* Editor aus t (Text), f (Format-Bits) und k (Blockstruktur) neu aufbauen */
function rebuildEditorFromPayload(p){
  const t=p.t||"", f=p.f||[], k=Array.isArray(p.k)?p.k:null;
  const fm=i=>fmtFromBits(f[i]||0);
  const root=ed; root.innerHTML="";
  function addLine(content,fmts){
    const div=document.createElement("div");
    const heading=content.length>0&&fmts.every(x=>x.h);
    if(heading){ div.classList.add("heading"); fmts=fmts.map(x=>({b:false,i:x.i,u:x.u})); }
    buildInline(div,content,fmts); root.appendChild(div);
  }
  function addTask(content,labelLen){
    const label=labelLen?content.slice(0,labelLen):"";
    const text=labelLen?content.slice(labelLen+1):content;
    root.appendChild(makeTaskBlock(label,text));
  }
  const ku=(k&&k.length)?kInUnits(t,k):null;
  if(ku&&ku.length){
    let idx=0;
    ku.forEach((rec,bi)=>{
      if(bi>0) idx++;                                            // Trenner "\n"
      const kind=rec[0]|0, n=Math.max(0,rec[1]|0), ll=Math.max(0,rec[2]|0);
      const content=t.slice(idx,idx+n); const fmts=[]; for(let i=idx;i<idx+n;i++) fmts.push(fm(i));
      if(kind===1) addTask(content,ll); else addLine(content,fmts);
      idx+=n;
    });
  } else {
    // ältere Dateien ohne Blockstruktur: Zeilen an "\n" trennen; zusammenhängende Zeilen aus vorgegebenem Text
    // (Aufgaben-Bit bzw. Marke "s"/"q") bilden einen Aufgabenblock
    const m=p.m||[]; const isSys=i=>fm(i).s||!!(m[i]&&(m[i][0]==="s"||m[i][0]==="q"));
    const lines=[]; let start=0;
    for(let i=0;i<=t.length;i++){ if(i===t.length||t[i]==="\n"){ lines.push([start,i]); start=i+1; } }
    let taskBuf=null;
    const flush=()=>{ if(taskBuf){ addTask(t.slice(taskBuf[0],taskBuf[1]),0); taskBuf=null; } };
    for(const [a,b] of lines){
      const isTaskLine=b>a; let allSys=isTaskLine; for(let i=a;i<b&&allSys;i++){ if(!isSys(i)) allSys=false; }
      if(allSys){ if(taskBuf) taskBuf[1]=b; else taskBuf=[a,b]; continue; }
      flush();
      const fmts=[]; for(let i=a;i<b;i++) fmts.push(fm(i));
      addLine(t.slice(a,b),fmts);
    }
    flush();
  }
  normalizeBlocks();
}
/* Zwischenstand fortsetzen: Name, Editor-Inhalt und die gespeicherten Zeitwerte je Zeichen übernehmen */
function resumeFromPayload(p){
  const nm=splitName(p); studentVorname=nm.vn; studentNachname=nm.nn;
  $("who-name").textContent=(studentVorname+" "+studentNachname).trim();
  const e=p.e||null; escapeMode=!!(e&&e.esc); escapeRed=(e&&Array.isArray(e.red))?e.red:[]; escapeCtx=escapeMode?cleanEscapeCtx(e.ctx):null;
  rebuildEditorFromPayload(p);
  const t=p.t||"", m=p.m||[];
  const fromFile=[];
  for(let i=0;i<t.length;i++){
    const mk=(m[i]&&m[i].length)?m[i]:["t",-1]; const src=mk[0];
    if(src==="s"||src==="q") fromFile.push({src:"s",t:-1});
    else fromFile.push({src:(src==="p"?"p":"t"),t:-1,g:(typeof mk[1]==="number")?mk[1]:-1});
  }
  prevValue=t; recs=fromFile;
  const ser=serializeEditor();
  if(ser.text!==t) reconcile(ser.text,"t",-1);   // Struktur nicht exakt rekonstruierbar: Abweichungen ohne Tipp-Info übernehmen
  applySystemFlags(ser.fmt);
  prefilled=escapeMode||(Array.isArray(CFG.prefill)&&CFG.prefill.length>0);
  $("taskhint").classList.toggle("hidden",prefilled);
  renderMoodleHints(); hideDlPanel(); closeTaskForm(); selectTask(null);
  updateEmpty(); updateCharcount();
  show("screen-editor");
  setTimeout(()=>{ focusLastAnswer(); positionTaskBtn(); },50);
}

/* Platzhalter ein-/ausblenden (CSS: #editor.empty::before) */
function updateEmpty(){
